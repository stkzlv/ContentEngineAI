# Content research (design 0023): `python -m src.research`. Read only by
# src/research; nothing here changes a render. Google Trends gives relative
# interest, so every figure is a share of one anchor term per side, and the
# anchors must stay the same between runs for figures to compare.

# Countries to measure (ISO codes, as Google Trends takes them).
countries: [US, GB]
# Seconds between Trends requests; it answers 429 to a faster client.
request_pause_sec: 10
# Retries for a rate-limited request, each after a longer pause.
max_retries: 2

products:
  # A steady, broad term the product keywords are measured against.
  anchor: "phone charger"
  # A keyword under this share of the products' median interest in every
  # country, with no rise over the last quarter, is a drop candidate.
  drop_below: 0.25
  # Rising searches next to this many of the strongest keywords are add
  # candidates, kept only when they measure at or above the median of the
  # keywords that are not drop candidates, in some country.
  related_from: 5
  # The English Wikipedia article for a keyword. Its monthly views, by people
  # rather than bots, are a second, absolute signal beside Trends' shares;
  # redirects are followed, and the report names the article reached. Map only a keyword with an article about that
  # product: a broad one ("Headphones" for earbuds) measures something else.
  wikipedia:
    - {keyword: "USB C hub", article: "USB hub"}
    - {keyword: "smart plug", article: "Smart plug"}
    - {keyword: "portable charger", article: "Battery pack"}
    - {keyword: "wireless charging pad", article: "Inductive charging"}
    - {keyword: "bluetooth tracker", article: "Key finder"}
    - {keyword: "LED strip lights", article: "LED strip light"}
    - {keyword: "digital picture frame", article: "Digital photo frame"}
    - {keyword: "bluetooth speaker", article: "Wireless speaker"}
    - {keyword: "smart ring", article: "Smart ring"}
    - {keyword: "mini projector", article: "Handheld projector"}
    - {keyword: "robot vacuum", article: "Robotic vacuum cleaner"}
    - {keyword: "smart doorbell camera", article: "Smart doorbell"}
    - {keyword: "noise cancelling earbuds", article: "Noise-cancelling headphones"}
    - {keyword: "smart watch", article: "Smartwatch"}
    - {keyword: "fitness tracker band", article: "Fitness tracker"}
    - {keyword: "solar power bank", article: "Solar charger"}
    - {keyword: "smart door lock", article: "Smart lock"}

topics:
  anchor: "iphone storage full"
  # Autocomplete stems: the suggestions show how viewers phrase questions.
  suggest_stems:
    - "how to turn off"
    # Phone-only stems: a bare "how to stop" returns hiccups and nosebleeds.
    - "how to stop my phone"
    - "how to stop spam"
    - "why is my phone"
    - "iphone how to"
    - "samsung how to"
    - "windows 11 how to"
    - "gmail how to"
    - "whatsapp how to"
  # What people ask on Stack Exchange sites, ranked by views per day since
  # asked. A technical audience, so a signal of what breaks, not of volume.
  # The API needs no key for these few requests (300 a day per address).
  stack_exchange:
    sources:
      - {site: apple, tagged: iphone}
      - {site: android}
      - {site: superuser, tagged: windows-11}
    days: 90
    pages: 3
    top: 10

# Text-only script samples (`sample` stage): the producer's script step, in
# memory, under each variant. Nothing is scraped or rendered.
sample:
  topics: 16          # pool topics, in pool order
  products: 8         # the most recently scraped products
  profile: slideshow_stock
  variants: [shipped, free_form, task_answer_first]
  band: [75, 100]     # words; a step-list script uses its own band

# Grounded verification (`verify` stage): one Gemini call with Google Search
# per topic script judges each step against official documentation.
verify:
  model: "gemini-3.7-flash"
  timeout_seconds: 90
