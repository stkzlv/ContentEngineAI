# ============================================================================
# SUBTITLE SYSTEM CONFIGURATION
# ============================================================================
# Complete subtitle system including ASS effects, positioning, and styling
# This config controls how subtitles are generated, positioned, and rendered
# in the final video output.
#
# ---- SUBTITLE ENGINE SELECTOR ----
# Two engines are available:
#   - "ffmpeg" (default): existing SRT/ASS path. Captions are burned by
#     FFmpeg's subtitles/drawtext filter via libass. Supports two-part
#     (upper URL + lower voiceover) subtitles and karaoke effects.
#   - "pycaps": animated CSS-styled captions burned post-assembly by the
#     pycaps library. TikTok/Reels look with word-level pop/fade/zoom
#     effects. Single-line only — two-part is disabled when pycaps is
#     selected. Requires the optional poetry group; see
#     docs/pycaps-subtitles.md.
#
# Select the engine per-profile by adding `subtitle_engine: pycaps` to a
# profile's subtitle_settings, or per-run via --subtitle-engine. The
# pycaps sub-block below only applies when engine == "pycaps".
#
# pycaps:
#   template_name: "word-focus"
#   template_pool: ["word-focus", "hype", "minimalist", "vibrant"]
#   renderer: "css"            # css (Chromium) or pictex (browserless)
#   max_width_ratio: 0.85
#   max_number_of_lines: 2
#   vertical_align: "bottom"
#   fallback_policy: "raise"

subtitle_settings:
  # ---- GLOBAL ENABLE/DISABLE ----
  # Master switch for subtitle generation and embedding
  # When false, no subtitles will be added to videos
  enabled: true

  # ---- SUBTITLE ENGINE ----
  # See header comment block for the full engine comparison.
  # Default "ffmpeg" preserves the existing SRT/ASS behaviour.
  subtitle_engine: "ffmpeg"

  # ---- PYCAPS ENGINE SUB-SETTINGS ----
  # Only consumed when subtitle_engine == "pycaps". Per-profile overrides
  # in video_production.yaml (pycaps_template, pycaps_renderer, etc.)
  # beat these globals, and CLI flags beat the profile layer.
  #
  # All defaults here track the starter recipe in
  # docs/subtitle-best-practices.md section 9 (Starter recipe).
  pycaps:
    # Fixed template name. Used when template_pool is empty or single-entry.
    # word-focus matches the recipe closest: white bold, word-by-word
    # karaoke, minimal animation.
    template_name: "word-focus"

    # Pool for deterministic per-product template selection (md5 keyed).
    # Ordered by how closely they track the best-practice recipe:
    #   word-focus = closest match (white + karaoke pop)
    #   hype       = higher-energy variant for promo content
    #   minimalist = calmer tone for educational/corporate
    #   vibrant    = gradient-heavy, use sparingly
    template_pool: ["word-focus", "hype", "minimalist", "vibrant"]

    # css = Playwright + Chromium. Full CSS fidelity, ~400 MB peak RSS,
    #       ~0.7x realtime on a 30s clip. Benchmark winner.
    # pictex = browserless Skia. Lighter install, limited CSS features.
    renderer: "css"

    # Max caption width as a fraction of frame width. This is the
    # user-facing knob; the actual value passed to pycaps is clamped
    # to the platform safe zone at render time so captions never
    # extend into TikTok/Shorts/Reels UI overlay zones regardless
    # of what's set here.
    max_width_ratio: 0.80

    # Max lines per caption segment. 2 lines is the universal best practice
    # for short-form — 3+ becomes a wall of text.
    max_number_of_lines: 2

    # Vertical positioning. "bottom" anchor + offset -0.20 places captions
    # at ~75% of frame height, matching the platform safe zone bottom
    # boundary (TikTok overlay starts at 75%). Tweak the offset to move
    # captions up (more negative) or down (closer to 0).
    vertical_align: "bottom"
    vertical_align_offset: -0.20

    # On render failure: "warn_and_skip" (keep the FFmpeg-assembled video)
    # or "raise" (abort the pipeline).
    fallback_policy: "raise"

  # ---- TIMING SMOOTHER ----
  # Post-processes raw Whisper word timestamps before they reach either
  # the FFmpeg or pycaps subtitle engine. Fixes flickering, short-word
  # flashes, and uneven segment durations from vanilla Whisper.
  # See docs/subtitle-best-practices.md section 5 for the research.
  timing_smoothing:
    enabled: true
    # Rule 1: minimum word duration (seconds). Words shorter than this
    # are extended so they don't flash imperceptibly.
    min_word_sec: 0.12
    # Rule 2: inter-word gaps shorter than this (seconds) are absorbed
    # into the preceding word to eliminate micro-flicker.
    gap_merge_sec: 0.08
    # Rule 3: extra hold time (seconds) added to the last word of each
    # detected segment, so the caption lingers after speech ends.
    hold_last_sec: 0.20
    # Rule 4: lead time (seconds). Each word appears this far ahead of
    # its audio onset so the viewer reads it just before hearing it.
    lead_sec: 0.04

  # ---- UNIFIED POSITIONING SYSTEM ----
  # Content-aware positioning that automatically adapts to visual layout
  # This system ensures subtitles don't overlap with images/videos

  # POSITIONING MODES:
  # - Absolute Mode (content_aware=false):
  #   Fixed positioning using anchor + margin
  #   Subtitles stay at same position regardless of content
  #   Example: anchor="bottom", margin=0.1, content_aware=false
  #
  # - Relative Mode (content_aware=true):
  #   Dynamic positioning that adjusts based on visual content boundaries
  #   Subtitles move to avoid overlapping images
  #   Example: anchor="below_content", margin=0.05, content_aware=true

  # Anchor point for subtitle positioning
  # Options:
  #   - top: Position at top of frame
  #   - center: Position at center of frame
  #   - bottom: Position at bottom of frame
  #   - above_content: Position above detected visual content
  #   - below_content: Position below detected visual content (recommended)
  anchor: "below_content"

  # Spacing margin as fraction of frame height (0.0-0.5)
  # Gap between subtitles and frame edge (absolute mode) or content (relative mode)
  # 0.04 = 4% of frame height spacing (~77px gap from content)
  margin: 0.04

  # Enable content-aware positioning
  # true = Relative Mode (subtitles adapt to content position)
  # false = Absolute Mode (fixed position)
  # Recommended: true for dynamic content, false for consistent positioning
  content_aware: true

  # ---- VISUAL STYLING ----
  # Style preset determines fonts, colors, effects, and overall appearance
  # Available presets:
  #   - minimal: Clean, simple styling with no effects
  #   - modern: Contemporary look with karaoke effect (default)
  #   - bold: High contrast with fade effect
  #   - animated: Full animations with movement effect
  #   - random: Randomized font, colors, and one random effect per video
  # Presets are defined in style_presets section below
  style_preset: "modern"

  # Font size multiplier (0.5-2.0)
  # 1.0 = base size (4% of frame height)
  # <1.0 = smaller text, >1.0 = larger text
  # Useful for adjusting readability without changing the base calculation
  font_size_scale: 1.0

  # Horizontal text alignment
  # Options: left, center, right
  # Controls where subtitle text is anchored horizontally
  horizontal_alignment: "center"

  # ---- TEXT FORMATTING AND SEGMENTATION ----
  # These settings control how subtitle text is broken into lines and segments
  # to ensure readability and proper timing

  # Maximum characters per subtitle line
  # Text longer than this will be broken into multiple lines
  # Default 30 works well for 1080x1920 vertical videos
  max_line_length: 30

  # Maximum words per subtitle line (for short-form content)
  # Ensures subtitles are readable in fast-paced videos
  # Set to 0 to disable word-based limiting and use only character limit
  # Recommended: 3 for TikTok/Reels style, 0 for longer-form content
  max_words_per_line: 3

  # Maximum subtitle width as fraction of total frame width (0.0-1.0)
  # Prevents subtitles from spanning too wide and becoming hard to read
  # Best practice target: 0.80 (80%) — leaves ~90px left/right margin on a
  # 1080-wide frame which is inside all three platform safe zones.
  # See docs/subtitle-best-practices.md section 3 (Layout and positioning).
  max_subtitle_width_fraction: 0.80

  # Maximum duration for any subtitle segment (seconds)
  # Segments longer than this will be split into multiple subtitles
  # Best practice target: 2.5s max — beyond this the viewer has already
  # read and scanned ahead, making the caption feel stale. See
  # docs/subtitle-best-practices.md section 4 (Timing and reading).
  max_duration: 2.5

  # Minimum duration for any subtitle segment (seconds)
  # Segments shorter than this may be combined or extended
  # Best practice target: 0.6s — anything shorter flashes imperceptibly
  # because eye→brain→recognition takes ~150-200ms minimum.
  min_duration: 0.6

  # ---- RANDOMIZATION OPTIONS ----
  # Enable variety in subtitle appearance across different videos
  # All randomization uses seeded random for consistency within a video

  # Use random font selection from curated collection
  # When true, selects font randomly per video (consistent within video)
  # Font collection defined in font_color_manager.py
  randomize_fonts: false

  # Use random color combinations from preset palette
  # When true, selects coordinated color pair randomly per video
  # Color pairs defined in font_color_manager.py
  randomize_colors: false

  # Use random animation effects when available
  # When true, applies random effects from preset's effect list
  # Effects are defined per style preset below
  randomize_effects: true

  # ---- OUTPUT FORMAT ----
  # Subtitle file format: "srt" or "ass"
  subtitle_format: "ass"

  # ---- TWO-PART SUBTITLE SYSTEM ----
  # Enable dual independent subtitle lines (upper + lower)
  # Upper line: Static product info (e.g., shortened URL)
  # Lower line: Timed voiceover subtitles
  # Profile-configurable for per-video customization
  two_part_subtitles:
    # Enable dual subtitle lines (requires profile support)
    enabled: false

    # Upper line configuration (static product info)
    upper_line:
      enabled: true
      # Source field from data.json to display (e.g., "product_url", "product_link", "shortened_url")
      source_field: "product_url"
      # Custom URL to display instead of source_field (optional, overrides source_field when set)
      custom_url: null
      # URL shortening method: "default" (built-in), "bitly", "tinyurl", or null (no shortening)
      url_shortener: "default"
      # Position anchor for upper line
      anchor: "above_content"
      # Spacing from content as fraction of frame height (0.0-0.5)
      # 0.04 = 4% of frame height spacing (~77px gap from content)
      margin: 0.04
      # Font size relative to main subtitles (0.5-2.0)
      font_size_scale: 0.7
      # Style preset for upper line (minimal, modern, bold, animated, random)
      style_preset: "minimal"
      # Custom styling (optional, overrides preset)
      custom_style: null

    # Lower line configuration (voiceover subtitles)
    lower_line:
      enabled: true
      # Position anchor for lower line
      anchor: "below_content"
      # Spacing from content as fraction of frame height (0.0-0.5)
      # 0.04 = 4% of frame height spacing (~77px gap from content)
      margin: 0.04
      # Uses standard subtitle_settings for styling when custom_style is null
      custom_style: null

  # ---- LEGACY COMPATIBILITY SETTINGS ----
  # These feed the drawtext-based SRT path plus a few fallback code paths.
  # Tuned to match the best-practice recipe in docs/subtitle-best-practices.md
  # so profiles that fall through to these values still look reasonable.
  font_directory: "static/fonts"
  font_name: "Montserrat"               # Bold sans-serif, research-backed default
  font_size_percent: 0.075              # ~144px at 1920 frame height (~7.5%)
  font_width_to_height_ratio: 0.55

  # Color settings — white fill + opaque black outline, no background box.
  # Background boxes compete with product imagery; skip unless the profile
  # explicitly needs one (noisy backgrounds).
  font_color: "&H00FFFFFF"              # White text
  outline_color: "&H00000000"           # Opaque black (was &HFF000000, which
                                         # set alpha to fully transparent —
                                         # bug masked by preset colors).
  back_color: null                       # No background box by default

  # Visual styling
  bold: true
  outline_thickness: 3                  # Thicker stroke — best practice is
                                         # 8-10% of font size. At 144px that's
                                         # ~13px, but libass caps visually
                                         # around 3-4 for cleanliness.
  shadow: true

  # Script fallback paths
  script_paths: ["info/script.txt"]

  # Quality thresholds
  subtitle_similarity_threshold: 0.70

# ============================================================================
# TEXT-TO-SPEECH CONFIGURATION
# ============================================================================
# TTS provider settings for generating voiceover audio from script text
# Used by: src/video/tts.py for voiceover generation
#
# Pipeline Impact:
# - Voiceover quality affects video professionalism and viewer engagement
# - Provider fallback ensures production continues if primary TTS unavailable
# - Word-level timing enables precise subtitle synchronization
#
# Providers:
# - google_cloud: High quality, natural voices, requires Google Cloud credentials
# - coqui: Open source, local processing, no API costs but lower quality
tts_config:
  # Order of TTS providers to try (attempts in sequence until one succeeds)
  # Recommendation: google_cloud first for quality, coqui as fallback
  provider_order: ["google_cloud", "coqui"]

  # Google Cloud Text-to-Speech Settings
  # Setup: Requires GOOGLE_APPLICATION_CREDENTIALS environment variable
  # Pricing: ~$16 per 1 million characters (check current rates)
  # Documentation: https://cloud.google.com/text-to-speech
  google_cloud:
    # Primary language code for voice selection
    # Format: language-region (e.g., "en-US", "en-GB", "es-ES")
    language_code: "en-US"

    # Voice selection criteria (tries in order until match found)
    # Criteria: language_code, name_contains (model family), ssml_gender
    # Fallback chain: Chirp3 → Chirp → Neural2 → any available voice
    voice_selection_criteria:
      - { language_code: "en-US", name_contains: "Chirp3", ssml_gender: "FEMALE" }
      - { language_code: "en-US", name_contains: "Chirp3", ssml_gender: "MALE" }
      - { language_code: "en-US", name_contains: "Chirp", ssml_gender: "FEMALE" }
      - { language_code: "en-US", name_contains: "Chirp", ssml_gender: "MALE" }
      - { language_code: "en-US", name_contains: "Neural2", ssml_gender: "FEMALE" }
      - { language_code: "en-US", name_contains: "Neural2", ssml_gender: "MALE" }
      - { language_code: "en-US", ssml_gender: "FEMALE" }
      - { language_code: "en-US", ssml_gender: "MALE" }

    # Speech synthesis parameters
    # speaking_rate: Speed multiplier (0.25-4.0, 1.0=normal, 1.2=20% faster)
    # pitch: Voice pitch adjustment in semitones (-20.0 to 20.0, 0=natural)
    # volume_gain_db: Volume adjustment in decibels (-96.0 to 16.0, 0=no change)
    speaking_rate: 1.0
    pitch: 0.0
    volume_gain_db: 0.0

    # API request configuration
    # debug: Enable verbose logging of API requests/responses
    # api_timeout_sec: Maximum wait time for TTS generation
    # api_max_retries: Number of retry attempts on failure
    # api_retry_delay_sec: Delay between retry attempts
    # last_word_buffer_sec: Extra silence at end to prevent word cutoff
    debug: false
    api_timeout_sec: 60
    api_max_retries: 2
    api_retry_delay_sec: 5
    last_word_buffer_sec: 0.5

  # Coqui TTS Settings (Local/Offline Processing)
  # Pros: Free, no API costs, works offline, privacy-friendly
  # Cons: Lower voice quality, slower generation, requires local compute
  # Setup: Automatically downloads models on first use (~200MB)
  coqui:
    # Model identifier from Coqui TTS model zoo
    # ljspeech/vits: Fast, decent quality, English only
    # Explore models: https://github.com/coqui-ai/TTS
    model_name: "tts_models/en/ljspeech/vits"

    # Speaker name for multi-speaker models (null for single-speaker)
    speaker_name: null

  # Set to false to disable voice profiles (uses default Chirp3-HD selection)
  voice_profiles_enabled: true

  # Voice profiles for style variety across products
  # Each profile controls provider, style, voice, and text markup
  # A random profile is selected per product (deterministic by product ID)
  #
  # Gemini profiles use simple voice names (Kore, Charon, Aoede, Puck, etc.)
  # and support the 'prompt' field for style control. Requires Vertex AI API
  # enabled on the GCP project.
  #
  # Google Cloud profiles use Chirp3-HD / Neural2 voices with SSML.
  voice_profiles:
    warm_conversational:
      provider: gemini
      gemini_model_name: "gemini-2.5-flash-tts"
      style_prompt: "Speak in a warm, friendly, conversational tone. Sound natural and enthusiastic about the product."
      speaking_rate: 1.10
      pitch: 1.0
      markup_rules:
        - { pattern: '\.\s+', insert_after: '[short pause] ' }
        - { pattern: '!\s+', insert_after: '[short pause] ' }

    soft_intimate:
      provider: gemini
      gemini_model_name: "gemini-2.5-flash-tts"
      style_prompt: "Speak softly, like a late-night product reviewer. Warm and intimate, but keep a natural pace."
      speaking_rate: 1.05
      markup_rules:
        - { pattern: '\.\s+', insert_after: '[short pause] ' }

    calm_authority:
      provider: gemini
      gemini_model_name: "gemini-2.5-flash-tts"
      style_prompt: "Speak calmly and authoritatively, like a trusted tech reviewer giving honest advice."
      speaking_rate: 1.10
      pitch: 1.0

    calm_confident:
      provider: gemini
      gemini_model_name: "gemini-2.5-flash-tts"
      style_prompt: "Speak calmly and confidently. Warm but grounded. Like a trusted friend recommending something over coffee."
      speaking_rate: 1.10

    gentle_storyteller:
      provider: gemini
      gemini_model_name: "gemini-2.5-flash-tts"
      style_prompt: "Speak gently, like telling a friend about something you found. Soft voice, natural pacing."
      speaking_rate: 1.05
      markup_rules:
        - { pattern: '\.\s+', insert_after: '[short pause] ' }

    chirp3_natural:
      provider: google_cloud
      voice_criteria:
        - { language_code: "en-US", name_contains: "Chirp3", ssml_gender: "FEMALE" }
        - { language_code: "en-US", name_contains: "Chirp3", ssml_gender: "MALE" }

  # Pool for random profile selection
  # Empty list = use all profiles. Set to ["chirp3_natural"] to use only Chirp3.
  voice_profile_pool: []

# ============================================================================
# SUBTITLE EFFECTS (ASS Format Animations)
# ============================================================================
# ASS (Advanced SubStation Alpha) format animation parameters
# These effects are applied when using style presets with effects enabled
# Each effect uses ASS override tags to create visual animations

subtitle_effects:
  # ---- KARAOKE EFFECT ----
  # Word-by-word color sweep effect synchronized with TTS timing
  # Creates the classic karaoke "bouncing ball" effect for highlighting active words

  # Timing range for karaoke effect per word (milliseconds)
  # min_ms: Fastest sweep speed (used for short words)
  # max_ms: Slowest sweep speed (used for long words)
  # Actual timing is calculated based on word duration from TTS
  karaoke_timing_min_ms: 20
  karaoke_timing_max_ms: 200

  # Karaoke color configuration (ASS color format: &HAABBGGRR)
  karaoke_primary_color: "&H0000FFFF"   # Yellow - initial text color (before sweep)
  karaoke_secondary_color: "&H00000000" # Black - fill color (during sweep)
  karaoke_outline_color: "&H00FFFFFF"   # White outline - makes black fill visible

  # Use fill karaoke (\kf) instead of timing-only karaoke (\k)
  # true = Fill effect (recommended for visibility)
  # false = Timing effect only (subtle)
  karaoke_use_fill: true

  # ---- ANIMATION DURATION FACTORS ----
  # Multiplied by subtitle segment duration to calculate animation timing
  # Higher values = slower animations, Lower values = faster animations
  # Example: 2-second subtitle * pulse_duration_factor(500) = 1000ms pulse cycle

  pulse_duration_factor: 500      # For scale pulse effect (breathing animation)
  bounce_duration_factor: 300     # For rotation bounce effect
  glow_duration_factor: 400       # For glow effect (color transition)

  # ---- SCALE EFFECT PARAMETERS ----
  # Controls the pulse/breathing animation scale range
  # Values are percentages of original size

  pulse_scale_max: 110            # Maximum scale (110% = 10% larger)
  pulse_scale_normal: 100         # Normal scale (100% = original size)

  # ---- MOVEMENT EFFECT PARAMETERS ----
  # Controls vertical movement animation

  # Vertical distance to move subtitles up/down (pixels)
  # Used by movement effect to create subtle vertical animation
  movement_distance_pixels: 50

  # ---- BOUNCE/ROTATION EFFECT PARAMETERS ----
  # Controls rotation-based bounce animation

  # Maximum rotation angle (degrees) - positive values rotate clockwise
  bounce_rotation_max: 5

  # Minimum rotation angle (degrees) - negative values rotate counter-clockwise
  bounce_rotation_min: -5

  # Resting rotation angle (degrees) - normal state, usually 0 (no rotation)
  bounce_rotation_rest: 0

  # ---- TYPEWRITER EFFECT PARAMETERS ----
  # Controls character-by-character reveal animation

  # Maximum time to reveal each character (seconds)
  # Determines the fastest reveal speed for typewriter effect
  typewriter_char_reveal_max_sec: 0.1

  # Minimum timing between character reveals (milliseconds)
  # Prevents reveal from being too fast to read
  typewriter_min_timing_ms: 50

  # ---- GLOW EFFECT PARAMETERS ----
  # Controls color transition glow animation

  # Starting color for glow effect (ASS format: &HAABBGGRR)
  glow_start_color: "&H00FFFF00"  # Yellow - initial glow color

  # Ending color for glow effect (ASS format: &HAABBGGRR)
  glow_end_color: "&H00000000"    # Black - final glow color

# ============================================================================
# TEXT RENDERING SETTINGS
# ============================================================================
# Low-level text rendering parameters for pixel-perfect subtitle positioning
# These settings are used by the rendering engine for layout calculations

text_rendering:
  # ---- CHARACTER WIDTH ESTIMATION ----
  # Factors used to estimate pixel width of different character types
  # Used for text wrapping and width constraint calculations

  # Narrow characters width factor (i, l, I, etc.)
  # Relative to average character width
  narrow_char_width_factor: 0.4

  # Wide characters width factor (M, W, m, etc.)
  # Relative to average character width
  wide_char_width_factor: 1.2

  # Space character width factor
  # Relative to average character width
  space_char_width_factor: 0.3

  # ---- PLATFORM SAFE ZONE ----
  # Boundaries to avoid platform UI overlays (TikTok, YouTube Shorts, Reels)
  # Values are fractions of frame dimensions. See docs/platform-safe-zones.md
  # Per-profile overrides available via subtitle_safe_zone_* fields
  safe_zone:
    min_x: 0.046    # Left: 50px on 1080w
    max_x: 0.778    # Right: 840px on 1080w (TikTok buttons)
    min_y: 0.104    # Top: 200px on 1920h (YouTube Shorts header)
    max_y: 0.75     # Bottom: 1440px on 1920h (TikTok overlay)

# ============================================================================
# SUBTITLE STYLE PRESETS
# ============================================================================
# Predefined style configurations combining fonts, colors, and effects
# Select preset using subtitle_settings.style_preset
# Each preset includes font styling, colors, and compatible effects

style_presets:
  # ---- MINIMAL PRESET ----
  # Use case: Professional, corporate content where subtitles should not distract
  # Best for: Educational videos, tutorials, technical content
  # Note: Even "minimal" should be bold sans-serif per best-practice research —
  # thin fonts lose readability on mobile. See docs/subtitle-best-practices.md.
  minimal:
    description: "Clean, simple styling with no effects"
    font_name: "Montserrat"            # Bold sans-serif (was Arial — too plain)
    font_color: "&H00FFFFFF"           # White text (ASS format: &HAABBGGRR)
    outline_color: "&H00000000"        # Black outline for readability
    background_color: null             # No background (transparent)
    bold: true                         # Bold weight — readability is not optional
    outline_thickness: 2               # Thin but visible (was 1 — too subtle)
    shadow: false                      # No drop shadow
    effects: []                        # No animation effects
    font_width_to_height_ratio: 0.5    # Character width estimation

  # ---- MODERN PRESET (DEFAULT) ----
  # Use case: Contemporary social media content with engagement features
  # Best for: YouTube, TikTok, Instagram Reels
  # This is the research-backed default for e-commerce product videos.
  modern:
    description: "Bold sans-serif with karaoke word-by-word highlighting"
    font_name: "Montserrat"            # Most-used caption font per Submagic corpus
    font_color: "&H00FFFFFF"           # White text
    outline_color: "&H00000000"        # Opaque black outline
    background_color: null             # No background box — product imagery wins
    bold: true                         # Weight 700+ for mobile readability
    outline_thickness: 3               # Thicker stroke (was 2) for contrast
    shadow: true                       # Drop shadow for depth on busy backgrounds
    effects: ["karaoke"]               # Word-by-word highlight — dominant trend
    font_width_to_height_ratio: 0.5

  # ---- BOLD PRESET ----
  # Use case: High-impact content requiring maximum readability
  # Best for: Promotional videos, announcements, action content
  bold:
    description: "High-impact bold styling with strong outline"
    font_name: "Gabarito"              # Strong, bold font
    font_color: "&H00FFFFFF"           # White text
    outline_color: "&H00000000"        # Opaque black outline
    background_color: null             # No background box (was 80% black —
                                        # background boxes kill engagement
                                        # on clean product shots)
    bold: true                         # Bold weight
    outline_thickness: 4               # Thicker outline (was 3) for max contrast
    shadow: true                       # Drop shadow
    effects: ["fade"]                  # Smooth fade-in/fade-out
    font_width_to_height_ratio: 0.5

  # ---- ANIMATED PRESET ----
  # Use case: Dynamic, engaging content with motion
  # Best for: Music videos, vlogs, entertainment content
  animated:
    description: "Karaoke with subtle motion for playful tones"
    font_name: "Gabarito"              # Bold font for visibility during animation
    font_color: "&H00FFFFFF"           # White text
    outline_color: "&H00000000"        # Opaque black outline
    background_color: null             # No background box
    bold: true                         # Bold weight
    outline_thickness: 3               # Thicker outline (was 2)
    shadow: true                       # Drop shadow
    effects: ["karaoke"]               # Karaoke (was "movement" — anti-pattern
                                        # per best-practice research; see
                                        # pycaps-followups.md for the upstream
                                        # effect removal task)
    font_width_to_height_ratio: 0.5

  # ---- RANDOM PRESET ----
  # Use case: Variety across video batch, automatic style variation
  # Best for: A/B testing, preventing style fatigue, experimentation
  # Note: Automatically enables randomize_fonts and randomize_colors
  random:
    description: "Randomized bold sans-serif with per-video effect selection"
    font_name: "Montserrat"            # Base font (was Impact — dated look).
                                        # Actual font randomized from the
                                        # curated collection at runtime.
    font_color: "&H00FFFFFF"           # Base color — randomized per video
    outline_color: "&H00000000"        # Base outline — randomized per video
    background_color: null             # No background box
    bold: true                         # Bold weight
    outline_thickness: 3               # Thicker outline (was 2)
    shadow: true                       # Drop shadow
    # Effect pool — narrowed to research-backed effects (was 7, included
    # rotation_bounce, glow, movement which are anti-patterns or fatiguing).
    effects: ["karaoke", "fade", "typewriter"]
    font_width_to_height_ratio: 0.5

# ============================================================================
# SUBTITLE SEGMENTATION
# ============================================================================
# Controls how subtitles are split into segments for optimal readability
# These settings work with TTS word timestamps to create natural breaks

subtitle_segmentation:
  # ---- FALLBACK TIMING ----
  # Default segment duration when TTS timing is unavailable

  # Fallback duration for subtitle segments (seconds)
  # Used when TTS word timestamps are missing or invalid
  # Segments are created by dividing script evenly into this duration
  fallback_segment_duration_sec: 2.5
