# ============================================================================
# URL Shortener Configuration
# ============================================================================
# URL shortening for affiliate links.
#
# INTEGRATION POINTS:
#   - Scraper: shortens during product scraping
#   - Video: description generator uses shortened links if available
#
# DEFAULT PROVIDER: bare (no-op, returns the canonical Amazon URL unchanged).
# Picsee is available as an opt-in by setting `provider: picsee` and supplying
# PICSEE_API_KEY. See docs/scraper.md for the trade-offs and the rationale.
# ============================================================================

url_shortener:
  # Enable/disable URL shortening globally
  enabled: true

  # Active provider. Choices: bare (default, no-op), picsee.
  provider: bare

  # ========================================================================
  # API CONFIGURATION
  # ========================================================================
  api:
    timeout_sec: 30
    max_retries: 3
    retry_delay_sec: 2
    retry_backoff_multiplier: 2

  # ========================================================================
  # BARE (NO-OP) CONFIGURATION
  # ========================================================================
  # Returns the input URL unchanged. No API key, no third-party dependency.
  # Use when the canonical affiliate URL (~50 chars) is already short enough
  # for every platform's caption budget and you want the affiliate tag to
  # round-trip end-to-end without a redirect chain.
  bare: {}

  # ========================================================================
  # PICSEE CONFIGURATION
  # ========================================================================
  # Opt-in. Requires PICSEE_API_KEY in .env. Picsee mints stte.psee.io short
  # codes that 302 to the affiliate URL. Tag preservation in the redirect has
  # been inconsistent in practice; the bare provider above is the recommended
  # default. See docs/scraper.md.
  picsee:
    api_key_env_var: PICSEE_API_KEY
    api_base_url: https://api.pics.ee
    custom_domain: stte.psee.io
    max_bulk_size: 100
    bulk_timeout_multiplier: 2.0

  # ========================================================================
  # INTEGRATION SETTINGS
  # ========================================================================
  integration:
    shorten_on_scrape: true
    fallback_to_original: true
