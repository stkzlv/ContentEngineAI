# ContentEngineAI Video Production Configuration
# Video encoding, audio processing, media gathering, and production profiles

# ============================================================================
# FILE NAMING CONVENTIONS
# ============================================================================
# Standard filenames for pipeline outputs across all stages of production
# These patterns are used by producer.py, assembler.py, and other modules
# to locate and save media files consistently throughout the pipeline
#
# Pipeline Impact:
# - Changing these requires updating all modules that reference file names
# - Video profile configurations reference these for output naming
# - Scripts and automation tools depend on these patterns
file_naming:
  # Audio output filenames
  # Used by TTS module (src/video/tts.py) for voiceover generation
  # Format: WAV for high-quality uncompressed audio
  voiceover: "voiceover.wav"

  # Subtitle output filenames
  # Used by subtitle_utils.py and unified_subtitle_generator.py
  # SRT: Simple subtitle format (timing + text only)
  # ASS: Advanced format supporting styling, effects, and precise positioning
  subtitles_srt: "subtitles.srt"
  subtitles_ass: "subtitles.ass"
  subtitles_content_aware: "subtitles_content_aware.ass"
  # NOTE: temp_subtitle removed - system uses subtitles.srt, subtitles.ass, etc. directly

  # Video output filenames
  # Used by assembler.py for final video generation
  # Placeholders: {product_id} = ASIN/product ID, {profile} = video profile name
  # Example: video_B07BHXYCXQ_slideshow_images1.mp4
  final_video: "video_{product_id}_{profile}.mp4"

  # Script input paths (legacy compatibility)
  # Fallback paths when script location not specified
  # Modern workflow uses data.json with embedded script text
  script_paths: ["info/script.txt"]

# ============================================================================
# VIDEO ENCODING SETTINGS
# ============================================================================
# Core video encoding parameters used by assembler.py (FFmpeg wrapper)
# These settings control output video quality, format, and performance
#
# Pipeline Impact:
# - resolution: Affects subtitle positioning, image scaling, text readability
# - frame_rate: Higher = smoother motion but larger files (30 fps recommended)
# - codec/preset/crf: Balance between encoding speed and file size/quality
# - Media validation thresholds determine minimum content needed for production
video_settings:
  # Video resolution [width, height]
  # 1080x1920 = vertical/portrait format optimized for TikTok, Instagram Reels
  # Used by: assembler.py for frame size, subtitle_utils.py for positioning
  resolution: [1080, 1920]

  # Video frame rate (frames per second)
  # 30 fps = standard for social media, balances smoothness and file size
  # Higher fps (60) increases file size significantly
  # Used by: assembler.py FFmpeg encoding
  frame_rate: 30

  # Video codec settings
  # libx264: H.264 codec, most compatible across platforms
  # preset: Encoding speed vs compression efficiency tradeoff
  #   ultrafast/faster = quick encoding, larger files
  #   medium = balanced (recommended for production)
  #   slow/slower = better compression, takes longer
  # crf: Constant Rate Factor for quality (0-51 scale)
  #   18 = visually lossless (very large files)
  #   23 = high quality, good compression (recommended)
  #   28 = acceptable quality, smaller files
  codec: "libx264"
  preset: "medium"
  crf: 23

  # Preserve aspect ratio when resizing images/videos
  # true = add letterboxing/pillarboxing to maintain original proportions
  # false = stretch/squash to fill frame (not recommended)
  # Used by: assembler.py when scaling media to fit frame
  preserve_aspect_ratio: true

  # Image display duration in seconds (for slideshow profiles)
  # How long each product image is shown on screen
  # Used by: producer.py to calculate slideshow timing
  # Note: Actual duration may vary if use_dynamic_image_count is enabled
  image_duration: 3.0

  # Video constraints and validation
  # Maximum allowed video duration (seconds)
  # Prevents accidentally creating overly long videos
  # Used by: producer.py validation, may truncate or fail if exceeded
  total_duration_limit_sec: 90

  # Tolerance for matching video duration to audio (seconds)
  # Allows small timing mismatches between final video and voiceover
  # Used by: Quality checks in assembler.py
  video_duration_tolerance_sec: 1.0

  # Minimum acceptable output video file size (MB)
  # Validation check to ensure video actually contains content
  # Used by: producer.py post-generation validation
  min_video_file_size_mb: 0.1

  # Timeout for FFmpeg probe operations (seconds)
  # Maximum time to wait when analyzing media file properties
  # Used by: assembler.py media duration detection
  verification_probe_timeout_sec: 30

  # Media validation requirements (MUST match scraper.yaml validation_config)
  # These thresholds determine if a product has sufficient media for video creation
  # Pipeline Impact:
  # - Products below these thresholds are rejected during scraping/production
  # - Affects batch processing success rate and output quality
  # - Higher values = better quality but fewer successful videos
  # NOTE: These values must match config/scraper.yaml validation_config
  min_total_media: 3              # Minimum combined images + videos
  min_images_if_no_video: 5       # Slideshow mode threshold (no product videos)
  min_images_with_video: 2        # Video mode threshold (has product videos)

  # Image positioning (used by video profiles)
  # Default position for product images within the video frame
  # Profiles can override these values for custom layouts
  # Values are fractions of frame dimensions (0.0-1.0)
  # Used by: producer.py when generating visual content
  image_width_percent: 1             # Image width as 100% of frame width
  image_top_position_percent: 0.0    # Top offset (only used when image_vertical_align is "top")
  image_vertical_align: center       # Vertical alignment: "center" or "top"

  # Fallback positioning for image-only videos (no product videos available)
  # Used by: visual_builder.py when profile expects videos but only images are available
  # Pipeline Impact: Ensures consistent positioning when video-centric profiles fall back to images
  fallback_image_top_percent: 0.15   # Top edge at 15% when falling back to image-only mode
  fallback_image_width_percent: 1    # Width at 100% when falling back to image-only mode

  # Aspect ratio settings for video processing
  # Used by: visual_builder.py smart-scale mode decision making
  # Pipeline Impact: Determines whether to letterbox or crop videos to fit frame
  smart_scale_tolerance: 0.10        # Tolerance threshold (10%) for aspect ratio matching
                                     # If video aspect differs by <10%, crop-to-fit; else letterbox

  # Timing and delays for batch processing
  # Random delays between product videos to avoid detection as automated content
  # Used by: Batch processing mode in producer.py
  inter_product_delay_min_sec: 1.5   # Minimum pause between products
  inter_product_delay_max_sec: 4.0   # Maximum pause between products
  min_visual_segment_duration_sec: 0.1  # Minimum length for any visual clip
  dynamic_image_count_limit: 25         # Maximum images to use in dynamic mode

  # Assembler-specific settings (FFmpeg subtitle rendering)
  # Used by: assembler.py when generating embedded subtitles
  # Note: Modern workflow uses external ASS files, these are legacy fallbacks
  default_max_chars_per_line: 20      # Character limit for subtitle wrapping
  subtitle_box_border_width: 5        # Border thickness around subtitle box
  base_font_height_percent: 0.05      # Base font size for subtitle height calculation (5% of frame height)
                                      # Used by: visual_builder.py to estimate subtitle vertical space
  image_loop: 1                       # Number of times to loop images (1=no loop)
  pad_color: "black"                  # Padding color for letterboxing

  # Persistent on-frame disclosure overlay (FTC #ad, Spain #publi, etc.)
  # Burned into every render in a fixed corner. Required for affiliate
  # content per FTC guidance ("clear and conspicuous", in the medium of the
  # endorsement). Sized smaller than narration captions (50-60%) so it
  # discloses without dominating the frame. See docs/compliance.md.
  disclosure_overlay:
    enabled: true                     # Set false to skip the overlay (not recommended for affiliate content)
    text: "#ad"                       # Disclosure text. Override for non-English renders.
    position: "top-right"             # top-left, top-right, bottom-left, bottom-right
    size_factor: 0.45                 # Font size as fraction of subtitle font size (slightly under FTC's 50-60% band; tuned for tighter corner placement)
    font_color: "white"
    outline_color: "black"
    outline_thickness: 3
    background_enabled: true          # Semi-transparent box for readability
    background_color: "black@0.5"     # FFmpeg color@alpha
    margin_x_percent: 0.04            # 4% from horizontal edge
    margin_y_percent: 0.12            # 12% from vertical edge (clears Shorts header / TikTok bottom)

  # System resource requirements
  # Used by: config_validator.py to verify system can handle video production
  # Pipeline Impact: Warns users if system resources are insufficient
  min_memory_gb: 2.0                  # Minimum RAM required for video production (GB)

  # Supported file formats
  # File extensions accepted by the pipeline for media processing
  # Used by: Media validation, file type detection throughout pipeline
  # Pipeline Impact: Files with other extensions are rejected
  supported_video_extensions: [".mp4", ".avi", ".mov", ".mkv", ".webm"]
  supported_audio_extensions: [".wav", ".mp3", ".aac", ".flac"]

# ============================================================================
# AUDIO SETTINGS
# ============================================================================
audio_settings:
  # NOTE: Audio encoding settings (sample_rate, channels, bitrate) are handled automatically by FFmpeg
  # Output format is controlled by output_audio_codec and output_audio_bitrate below

  # Volume levels (dB)
  music_volume_db: -24.0
  voiceover_volume_db: 3.0

  # Audio mixing settings
  audio_mix_duration: "first"  # Use first track (voiceover) duration to keep audio/subtitle sync

  # Audio encoding for output
  output_audio_codec: "aac"
  output_audio_bitrate: "192k"

  # Music fade in/out durations (seconds)
  music_fade_in_duration: 2.0
  music_fade_out_duration: 3.0

  # Background music file paths (local fallbacks)
  # Used when all API providers fail or are unavailable
  # Supports MP3, WAV, AAC formats - randomly selected from list
  background_music_paths:
    - "static/background-music-calm-soft-334182.mp3"
    - "static/background-music-happy-333014.mp3"
    - "static/background-music-upbeat-energetic-333016.mp3"

  # ============================================================================
  # AUDIO PROVIDER CHAIN
  # ============================================================================
  # Providers are tried in order. First successful download wins.
  # If all providers fail, falls back to local background_music_paths above.
  # Each provider needs its API key set in .env (see env var names below).
  audio_providers:
    - name: "jamendo"
      enabled: true
      settings:
        client_id_env_var: "JAMENDO_CLIENT_ID"
        api_timeout_sec: 15
        download_timeout_sec: 60
        # Search mode: "fuzzytags" (OR match, more results), "tags" (AND match,
        # stricter), "search" (free text across names/artists/tags)
        search_mode: "fuzzytags"
        # One query is picked randomly per product for variety.
        # Use + to combine tags (fuzzytags=OR, tags=AND).
        search_queries:
          - "ambient chill"
          - "soft background"
          - "calm lofi"
          - "minimal electronic"
          - "gentle acoustic"
    - name: "freesound"
      enabled: true

  # ============================================================================
  # FREESOUND CONFIGURATION (Creative Commons Music API)
  # ============================================================================
  # Freesound provides Creative Commons licensed music for background audio
  # Features: OAuth2 authentication, preview/full downloads, circuit breaker
  # Documentation: https://freesound.org/docs/api/
  # Setup Guide: See CONFIGURATION.md "Freesound OAuth2 Setup" section

  # --- API Authentication (Required) ---
  # Environment variable containing Freesound API key
  # Get key from: https://freesound.org/apiv2/apply/
  # Usage: Preview downloads (MP3 quality), search operations
  freesound_api_key_env_var: "FREESOUND_API_KEY"

  # --- OAuth2 Authentication (Optional, for full-quality downloads) ---
  # Environment variables for OAuth2 refresh token authentication
  # Setup: See CONFIGURATION.md for complete OAuth2 setup instructions
  # Benefits: Download original quality audio files (not just previews)
  freesound_client_id_env_var: "FREESOUND_CLIENT_ID"
  freesound_client_secret_env_var: "FREESOUND_CLIENT_SECRET"
  freesound_refresh_token_env_var: "FREESOUND_REFRESH_TOKEN"

  # --- Search Configuration ---
  # Default search query for background music
  # Tip: Use descriptive terms like "upbeat", "calm", "energetic", "corporate"
  freesound_search_query: "calm ambient instrumental"

  # Freesound filter string for search refinement
  # Syntax: "field:[min TO max]" or "field:value"
  # Examples:
  #   duration:[60 TO 180]        - 1-3 minute tracks
  #   duration:[10 TO 30]         - Short clips
  #   license:"Creative Commons 0" - Public domain only
  #   tag:music tag:background    - Multiple tags
  # Documentation: https://freesound.org/docs/api/resources_apiv2.html#search
  freesound_filters: "duration:[60 TO 180]"

  # Sort order for search results
  # Options: rating_desc, duration_asc, duration_desc, created_desc, created_asc
  # Recommendation: "rating_desc" for quality, "duration_asc" for short tracks
  freesound_sort: "rating_desc"

  # Maximum number of search results to fetch
  # Higher values = more options but slower search
  # Recommendation: 10-20 for good selection, 3-5 for speed
  freesound_max_results: 15

  # Maximum duration for track selection (seconds)
  # System ignores tracks longer than this value
  # Set to 9999 to disable (uses voiceover duration matching instead)
  freesound_max_search_duration_sec: 9999

  # --- Timeout Configuration ---
  # API request timeout (seconds)
  # Covers: Search operations, token refresh, metadata retrieval
  # Increase if experiencing frequent timeouts on slow connections
  freesound_api_timeout_sec: 15

  # Download timeout (seconds)
  # Covers: Preview downloads (API key) and full downloads (OAuth2)
  freesound_download_timeout_sec: 60

  # --- OAuth2 Token Management ---
  # Token expiration time (seconds)
  # Freesound access tokens typically valid for 1 hour (3600s)
  # System automatically refreshes tokens before expiration
  freesound_token_expiry_sec: 3600

  # Token refresh buffer (seconds)
  # How far before expiration to trigger automatic refresh
  # Recommendation: 60s provides safety margin for slow refreshes
  freesound_token_refresh_buffer_sec: 60

  # --- Retry and Backoff Configuration ---
  # Used by: src/audio/freesound_client.py (lines 349-418)
  # Controls how many times to retry failed operations and delay between attempts

  # Token refresh retry configuration
  freesound_token_refresh:
    # Maximum retry attempts for token refresh
    # After this many failures, fallback to API key or local files
    max_retries: 2

    # Timeout for token refresh requests (seconds)
    # Freesound OAuth2 endpoint typically responds in <1s
    timeout_sec: 5

    # Exponential backoff configuration
    # Delay = base_delay * (multiplier ** attempt)
    # Example: 0.5s, 1.0s, 2.0s with base=0.5 and multiplier=2
    backoff_base_delay_sec: 0.5
    backoff_multiplier: 2.0

  # Download retry configuration
  freesound_download:
    # Maximum retry attempts for downloads
    # Retries help with transient network issues
    max_retries: 2

    # Exponential backoff configuration for download retries
    # Longer base delay since downloads may be rate-limited
    backoff_base_delay_sec: 1.0
    backoff_multiplier: 2.0

  # --- Download Settings ---
  # Download chunk size for streaming (bytes)
  # Larger = faster downloads but more memory usage
  # 32KB (32768) is optimal for most use cases
  freesound_download_chunk_size: 32768

  # --- Fallback Behavior ---
  # When Freesound unavailable (circuit breaker open or API errors):
  # 1. OAuth2 fails → Fallback to API key preview download
  # 2. API key fails → Fallback to local files (background_music_paths)
  # 3. Local files → Random selection from available music files
  #
  # Circuit Breaker: Configured in src/utils/circuit_breaker.py
  # After repeated failures, circuit opens to fast-fail and use local files
  # This prevents wasting time on unavailable services during batch processing

  # Background music settings
  background_music:
    enabled: true
    # NOTE: fade_in_duration and fade_out_duration are configured above (lines 170-171)
    # NOTE: Background music always loops to match video duration

# ============================================================================
# MEDIA GATHERING
# ============================================================================
# Configuration for collecting and filtering media assets (images and videos)
# Used by: producer.py and media_extractor.py for stock media integration
#
# Pipeline Impact:
# - temp_media_dir: Stores downloaded Pexels/stock assets during production
# - stock_media_keywords: Influences relevance of stock media searches
# - Duration limits: Filters stock videos to appropriate lengths
media_settings:
  # Temporary directory for downloaded stock media assets
  # Created automatically during video production, can be cleaned up after
  # Location: Relative to project root
  temp_media_dir: "downloaded_media_assets"

  # Keywords for stock media search queries
  # Used when profile enables use_stock_images or use_stock_videos
  # Tips: Use broad, generic terms; avoid product-specific words
  # Example searches: "product showcase technology", "modern lifestyle happy customer"
  stock_media_keywords:
    - "product showcase"
    - "modern lifestyle"
    - "technology"
    - "happy customer"

  # Stock video duration constraints (seconds)
  # Filters search results to clips within this range
  # Short clips (5-20s) work best for product videos
  # Longer clips increase file size and processing time
  stock_video_min_duration_sec: 5
  stock_video_max_duration_sec: 20

  # Product title keyword filtering (minimum word length)
  # When extracting keywords from product titles for stock searches
  # Words shorter than this are ignored (filters "the", "a", "is", etc.)
  product_title_keyword_min_length: 3

  # NOTE: max_images_per_product and max_videos_per_product are configured in scraper.yaml
  # NOTE: image_quality and video_quality settings are configured in scraper.yaml

# ============================================================================
# STOCK MEDIA SETTINGS
# ============================================================================
# Configuration for third-party stock media providers (Pexels for images/videos)
# Used by: Stock media integration in producer.py
#
# Usage:
# - Enable per-profile using use_stock_images and use_stock_videos flags
# - No global toggle - each video profile specifies its own media sources
# - Requires API key from https://www.pexels.com/api/
#
# Pipeline Impact:
# - When enabled, supplements scraped product media with professional stock content
# - Useful when products have insufficient media or need higher visual quality
stock_media_settings:
  # NOTE: Stock media usage is controlled by profile flags: use_stock_images, use_stock_videos
  # No global "enabled" flag needed - each profile specifies which media types to use

  # Pexels API configuration
  # Environment variable containing Pexels API key
  # Get free key from: https://www.pexels.com/api/
  # Rate limits: 200 requests/hour (free tier)
  pexels_api_key_env_var: "PEXELS_API_KEY"

  # Note: Freesound integration removed - background music uses audio_settings instead

# ============================================================================
# VIDEO PROFILES
# ============================================================================
video_profiles:
  # Base profile (shared defaults)
  base:
    description: "Base profile with common settings for all video types."
    # Default media sources - use scraped images only
    use_scraped_images: true
    use_scraped_videos: false
    use_stock_images: false
    use_stock_videos: false
    use_dynamic_image_count: true
    # NOTE: Video settings (transitions, aspect ratio) controlled by profile-level config
    # NOTE: Audio normalization handled automatically by pipeline
    # NOTE: Background music controlled by audio_settings.background_music section
    # NOTE: Subtitle settings controlled by profile-level subtitle_* config

  # Slideshow with images profile
  slideshow_images1:
    description: "Dynamically uses scraped product images to match voiceover duration. Uses SRT format (no advanced effects)."
    use_scraped_images: true
    use_scraped_videos: false
    use_stock_images: false
    use_stock_videos: false
    use_dynamic_image_count: true

    # Image positioning overrides
    image_width_percent: 1
    image_top_position_percent: 0.15              # Position image lower (15% from top)

    # Subtitle format - SRT (simple format, no ASS effects like karaoke)
    subtitle_format: "srt"

    # Subtitle positioning overrides
    subtitle_anchor: "below_content"               # Position below visual content
    subtitle_margin: 0.05                          # Small margin (5%)
    subtitle_content_aware: true                   # Auto-adjust based on visual content
    subtitle_horizontal_alignment: "center"        # Center horizontally

    # Subtitle style overrides
    # NOTE: SRT format doesn't support effects - use "minimal" or "bold" preset
    # For karaoke/animated effects, use subtitle_format: "ass" instead
    subtitle_style_preset: "bold"                  # Bold style (no effects, SRT-compatible)
    subtitle_font_size_scale: 1.0                  # Normal font size
    subtitle_randomize_fonts: false                # SRT doesn't support font changes
    subtitle_randomize_colors: false               # SRT doesn't support color changes
    subtitle_randomize_effects: false              # No effects in SRT format

    # Text formatting overrides — aligned with docs/subtitle-best-practices.md
    subtitle_max_line_length: 38                   # Max characters per line
    subtitle_max_words_per_line: 3                 # 3 words per line (was 2)
    subtitle_max_subtitle_width_fraction: 0.80     # Up from 0.67 (80% of frame)
    subtitle_max_duration: 2.5                     # Down from 4.5 (best practice)
    subtitle_min_duration: 0.6                     # Up from 0.4 (flashing floor)

  # Slideshow with images profile (variant 2)
  slideshow_images2:
    description: "Alternative slideshow using scraped product images with different styling."
    use_scraped_images: true
    use_scraped_videos: false
    use_stock_images: false
    use_stock_videos: false
    use_dynamic_image_count: true

    # Image positioning overrides
    image_width_percent: 1
    image_top_position_percent: 0.15

    # Subtitle positioning overrides
    subtitle_anchor: "below_content"           # top, center, bottom, above_content, below_content
    subtitle_margin: 0.05                      # Fraction of frame height (0.0-0.5)
    subtitle_content_aware: true               # Auto-adjust based on visual content
    subtitle_horizontal_alignment: "center"    # left, center, right

    # Subtitle style overrides
    subtitle_style_preset: "bold"              # minimal, modern, bold, animated, random
    subtitle_font_size_scale: 0.8              # Font size multiplier (0.5-2.0)
    subtitle_randomize_fonts: true
    subtitle_randomize_colors: true
    subtitle_randomize_effects: false

    # Text formatting overrides — aligned with docs/subtitle-best-practices.md
    subtitle_max_line_length: 30               # Was 24 (too tight, single-word lines)
    subtitle_max_words_per_line: 3             # Was 2 — 3 is the sweet spot
    subtitle_max_subtitle_width_fraction: 0.80 # Was 0.85 — match recipe
    subtitle_max_duration: 2.5                 # Was 4.0 — best practice
    subtitle_min_duration: 0.6                 # Was 0.5 — flashing floor

    # Manual selection overrides (bypass randomization, optional)
    # subtitle_selected_font: "Montserrat"     # Force a specific font
    # subtitle_selected_color_pair: "white_black" # Force a specific color pair

  # Slideshow with images profile (variant 3 - dual subtitles)
  slideshow_images3:
    description: "Slideshow with dual independent subtitle lines - upper for product URL, lower for voiceover."
    use_scraped_images: true
    use_scraped_videos: false
    use_stock_images: false
    use_stock_videos: false
    use_dynamic_image_count: true

    # Image positioning overrides
    image_width_percent: 1
    image_top_position_percent: 0.12

    # Two-part subtitle system configuration
    two_part_subtitles:
      enabled: true
      upper_line:
        enabled: true
        source_field: "shortened_affiliate_link"
        custom_url: ""  # Set via SUBTITLE_BUSINESS_URL env var
        anchor: "above_content"
        margin: 0.04
        font_size_scale: 0.7
        style_preset: "minimal"
        use_full_duration: false   # Display ONLY during CTA moments
        randomize_effects: false
        prefix_replace: "Product: "  # "https://" → "Product: "
      lower_line:
        enabled: true
        anchor: "bottom"
        margin: 0.04

    # Subtitle format and styling (applies to both lines)
    subtitle_format: "ass"
    subtitle_content_aware: true
    subtitle_horizontal_alignment: "center"

    # Lower line styling (voiceover subtitles)
    subtitle_style_preset: "modern"
    subtitle_font_size_scale: 1.0
    subtitle_randomize_fonts: true
    subtitle_randomize_colors: true
    subtitle_randomize_effects: true

    # Text formatting — aligned with docs/subtitle-best-practices.md
    subtitle_max_line_length: 30
    subtitle_max_words_per_line: 3           # Was 2
    subtitle_max_subtitle_width_fraction: 0.80
    subtitle_max_duration: 2.5               # Was 4.0
    subtitle_min_duration: 0.6               # Was 0.5

  # Slideshow with images profile (variant 4 - CTA-synchronized dual subtitles)
  slideshow_images4:
    description: "Slideshow with CTA-synchronized dual subtitles - upper URL appears only during call-to-action moments."
    use_scraped_images: true
    use_scraped_videos: false
    use_stock_images: false
    use_stock_videos: false
    use_dynamic_image_count: true

    # Image positioning overrides
    image_width_percent: 1                 # Medium size images
    image_top_position_percent: 0.20       # Position images in upper-middle area

    # Two-part subtitle system configuration
    two_part_subtitles:
      enabled: true
      upper_line:
        enabled: true
        source_field: "shortened_affiliate_link"
        custom_url: ""  # Set via SUBTITLE_BUSINESS_URL env var
        anchor: "above_content"
        margin: 0.03   # Gap above image (3% = ~58px)
        font_size_scale: 0.7
        style_preset: "minimal"
        use_full_duration: false   # Display ONLY during CTA moments
        randomize_effects: false
        prefix_replace: ""         # Keep full URL visible
      lower_line:
        enabled: true
        anchor: "below_content"
        margin: 0.04

    # Subtitle format and styling (applies to both lines)
    subtitle_format: "ass"
    subtitle_content_aware: true
    subtitle_horizontal_alignment: "center"
    subtitle_margin: 0.04                    # Small gap below images (4% of frame = ~77px spacing)

    # Lower line styling (voiceover subtitles)
    subtitle_style_preset: "modern"
    subtitle_font_size_scale: 1.0
    subtitle_randomize_fonts: true
    subtitle_randomize_colors: true
    subtitle_randomize_effects: true

    # Text formatting — aligned with docs/subtitle-best-practices.md
    subtitle_max_line_length: 30
    subtitle_max_words_per_line: 3           # Was 2
