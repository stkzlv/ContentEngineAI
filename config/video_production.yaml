# ============================================================================
# BATCH PROCESSING SETTINGS
# ============================================================================
# Configuration for batch video production mode (--batch flag)
# Used by: producer CLI (cli.py) when processing multiple products
#
# Pipeline Impact:
# - profile_pool: Controls which video profiles are used for random selection
# - Empty list = all available profiles will be used
# - Specified list = only those profiles will be randomly selected
batch:
  # Profile pool for random profile selection (--random-profile mode)
  # List of profile names to randomly select from when processing products
  #
  # Behavior:
  # - Empty list [] = Use all available video profiles (default)
  # - Specific profiles = Only select from the specified profiles
  # - CLI --profile-pool argument overrides this setting
  #
  # Example: ["slideshow_images1", "video_sequential", "mixed_media"]
  #
  # Note: This is only used when --random-profile is enabled.
  # When using --batch-profile, this setting is ignored.
  profile_pool:
    - slideshow_images1
    - slideshow_images2
    - slideshow_images3
    - slideshow_images4
    - product_video_sequential
    - product_video_single
    - product_video_mixed
    - product_video_primary
