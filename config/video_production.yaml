# ============================================================================
# CTA DETECTION SETTINGS
# ============================================================================
# Call-to-Action detection for subtitle timing synchronization
# Used by: src/video/cta_detector.py and src/video/subtitle_utils.py
#
# Pipeline Impact:
# - min_cta_duration: Minimum total duration for CTA windows (< this = use full duration)
# - fallback_duration: Large fallback duration when CTA detection unavailable
# - Keywords and detection thresholds are defined in cta_detector.py
cta_detection:
  # Minimum total duration (seconds) for detected CTA windows
  # If total CTA duration < this value, fall back to full video duration
  min_cta_duration: 0.5

  # Default CTA duration (seconds) for fallback when detection fails
  # Used when CTA windows are too short or no CTA detected
  # Shows URL subtitle for this duration at end of video
  # Used by: src/video/subtitle_utils.py fallback CTA window creation
  # Affects: Fallback CTA subtitle timing when detection unavailable
  default_cta_duration: 5.0

  # Fallback duration (seconds) when voiceover duration unavailable
  # Used as placeholder for static subtitles
  fallback_duration: 9999.0

  # CTA keyword detection settings
  keywords:
    - "link"
    - "bio"
    - "check out"
    - "visit"
    - "follow"
    - "share"
    - "like"
    - "subscribe"
    - "click"
    - "tap"
    - "swipe"
    - "purchase"
    - "buy"
    - "shop"
    - "get"

  # Whether keyword matching is case-sensitive
  case_sensitive: false

  # Maximum gap (seconds) between CTA segments to merge into one window
  # Merges adjacent CTA segments if gap between them < this threshold
  # Used by: src/video/cta_detector.py to consolidate CTA windows
  # Affects: Number and timing of CTA subtitle windows
  merge_gap_threshold: 0.5

# ============================================================================
# FORMAT NORMALIZATION SETTINGS
# ============================================================================
# Controls video format normalization to ensure compatibility across all content
# Used by: src/video/assembler.py normalize_video_format() method (lines 801-850)
#
# Pipeline Impact:
# - Ensures all videos use consistent frame rate, codec, and pixel format
# - Prevents playback issues from format mismatches
# - Re-encodes videos only when necessary (based on tolerance checks)
#
# Performance Notes:
# - Re-encoding is CPU-intensive (~30-60s per video)
# - fps_tolerance reduces unnecessary re-encodes (0.1 = 10% tolerance)
format_normalization:
  # Target frame rate for all videos (frames per second)
  # Most displays support 30fps; higher values increase file size
  target_fps: 30.0

  # FPS tolerance for determining if re-encoding is needed
  # If video fps is within this tolerance of target, skip re-encode
  # Example: 0.1 means 29.7-30.3 fps is acceptable
  fps_tolerance: 0.1

  # Default frame rate string for FFmpeg (numerator/denominator format)
  # Used as fallback when frame rate cannot be parsed from video metadata
  default_fps_string: "30/1"

  # Target video codec (h264 for maximum compatibility)
  # H.264 is supported by virtually all devices and browsers
  target_codec: "h264"

  # Target pixel format (yuv420p for maximum compatibility)
  # yuv420p is required for some platforms (iOS Safari, older Android)
  target_pixel_format: "yuv420p"

# ============================================================================
# ASPECT RATIO HANDLING
# ============================================================================
# Controls how aspect ratio differences are handled in smart-scale mode
# Used by: src/video/assembler.py _apply_smart_scale_mode() method (line 1718)
#
# Pipeline Impact:
# - Determines when to crop vs letterbox content to match target aspect ratio
# - Affects visual appearance and how much content is visible
#
# Visual Examples:
# - tolerance=0.10: 16:9 video in 16:9 frame = crop (within 10%)
# - tolerance=0.05: 4:3 video in 16:9 frame = letterbox (exceeds 5%)
aspect_ratio:
  # Tolerance for aspect ratio similarity (fraction, not percentage)
  # If content aspect ratio is within this tolerance of target, use crop-to-fit
  # Otherwise use letterbox to show full content with black bars
  #
  # Examples:
  # - 0.10 = 10% tolerance (more aggressive cropping)
  # - 0.05 = 5% tolerance (more conservative, prefers letterbox)
  smart_scale_tolerance: 0.10

# ============================================================================
# TIMING CONSTRAINTS
# ============================================================================
# Minimum duration constraints for video segments and subtitle display
# Used by: src/video/subtitle_positioning.py and assembler.py
#
# Pipeline Impact:
# - Prevents too-short clips that feel jarring or fail to render
# - Ensures subtitles display long enough to be readable
timing:
  # Minimum segment duration in seconds
  # Prevents creation of video clips shorter than this
  # Too-short clips can cause rendering issues or feel jarring
  min_segment_duration_sec: 0.1

  # Minimum safe trim duration (provides buffer for timing accuracy)
  # Used when trimming video segments to ensure clean cuts
  min_safe_trim_duration_sec: 0.5


