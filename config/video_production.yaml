# ============================================================================
# LLM SETTINGS (Script Generation)
# ============================================================================
# Large Language Model configuration for AI script generation
# Used by: src/ai/script_generator.py for creating video voiceover scripts
#
# Pipeline Impact:
# - Script quality directly affects video engagement and conversions
# - models: Fallback list (tries in order until one succeeds)
# - auto_select_free_model: Automatically uses free tier models when available
# - max_tokens: Controls script length (350 tokens ≈ 60-90 seconds of speech)
# - temperature: Creativity level (0.0=deterministic, 1.0=creative, 0.7=balanced)
#
# OpenRouter aggregates multiple LLM providers (OpenAI, Anthropic, Meta, etc.)
# Requires: OPENROUTER_API_KEY environment variable
# Cost: Varies by model ($0-$0.02 per 1K tokens, check current pricing)
llm_settings:
  # LLM provider (currently only "openrouter" supported)
  provider: "openrouter"

  # Environment variable containing OpenRouter API key
  # Get key from: https://openrouter.ai/
  api_key_env_var: "OPENROUTER_API_KEY"

  # Auto-select free models when available (recommended for testing)
  # When true: Prefers free tier models from the models list
  # When false: Uses first available model regardless of cost
  auto_select_free_model: true

  # Model fallback list (tries in order)
  # Format: "provider/model-name" or "provider/model-name:free"
  # :free suffix = free tier only (no cost but may have rate limits)
  models:
    - "openai/gpt-3.5-turbo"              # Fast, good quality, low cost
    - "deepseek/deepseek-chat-v3-0324:free"  # Free tier, decent quality
    - "meta-llama/llama-3-8b-instruct:free"  # Free tier, good for scripts

  # Maximum tokens in generated script
  # 350 tokens ≈ 60-90 seconds of voiceover
  # Increase for longer scripts, decrease for shorter
  # Note: Longer scripts = higher API costs
  max_tokens: 350

  # Temperature: Controls output randomness (0.0-2.0)
  # 0.0 = deterministic, repetitive (not recommended)
  # 0.7 = balanced creativity (recommended for marketing scripts)
  # 1.0+ = highly creative, less predictable
  temperature: 0.7

  # API timeout and retry configuration
  # Increase timeout for slower models or poor network
  timeout_seconds: 90         # Max wait time for API response
  retry_attempts: 3           # Number of retries on failure
  retry_min_wait_sec: 2       # Initial retry delay (exponential backoff)
  retry_max_wait_sec: 30      # Maximum retry delay

  # Prompt template file path
  # Contains instructions for script generation
  # Customize to change script style, tone, or structure
  prompt_template_path: "src/ai/prompts/video_script.md"

# ============================================================================
# DESCRIPTION SETTINGS
# ============================================================================
description_settings:
  enabled: true
  prompt_template_path: "src/ai/prompts/video_description.md"
  target_platforms: ["tiktok", "youtube", "instagram"]
  max_tokens: 200

# ============================================================================
# FFMPEG SETTINGS
# ============================================================================
# FFmpeg executable configuration and working directories
# Used by: assembler.py, async_io.py for video encoding operations
#
# Pipeline Impact:
# - executable_path: If empty, uses system PATH FFmpeg (recommended)
# - temp_ffmpeg_dir: Temporary workspace for encoding (auto-cleaned)
# - preset: Encoding speed for intermediate files (ultrafast saves time)
# - timeout: Maximum time for final assembly (increase for long videos)
ffmpeg_settings:
  # Path to FFmpeg executable (leave empty to use system PATH)
  # Only set if using custom FFmpeg build or non-standard installation
  executable_path: ""

  # Temporary directory for FFmpeg intermediate files
  # Used for: Multi-pass encoding, filter complex operations
  # Auto-cleaned after successful video generation
  temp_ffmpeg_dir: "ffmpeg_work"

  # Encoding preset for intermediate segments (speed vs quality)
  # ultrafast = fastest encoding, acceptable quality for temp files
  # Used during: Multi-stage video assembly before final encode
  intermediate_segment_preset: "ultrafast"

  # Maximum time to wait for final assembly (seconds)
  # Increase for very long videos or slow hardware
  # Used by: assembler.py final encoding timeout
  final_assembly_timeout_sec: 600

# ============================================================================
# SUBTITLE SETTINGS
# ============================================================================
# NOTE: Full subtitle configuration is in config/subtitles.yaml
# This section contains only legacy compatibility settings
# For all subtitle configuration, see subtitles.yaml

# ============================================================================
# WHISPER SETTINGS (Speech Recognition)
# ============================================================================
# OpenAI Whisper model configuration for speech-to-text operations
# Used by: stt_functions.py for generating word-level timestamps from audio
#
# Pipeline Impact:
# - model_size: Larger models = more accurate but slower and more RAM
#   - tiny: Fastest, least accurate, 1GB RAM
#   - small: Good balance (recommended), 2GB RAM
#   - medium: Better accuracy, 5GB RAM
#   - large: Best accuracy, 10GB RAM
# - model_device: "cpu" or "cuda" (GPU acceleration if available)
# - Used for: Subtitle timing synchronization with voiceover
whisper_settings:
  # Enable Whisper transcription for subtitle timing
  # When false, falls back to estimated timing
  enabled: true

  # Whisper model size (tiny/small/medium/large)
  # Smaller = faster but less accurate
  # Larger = slower but more accurate
  # Recommended: "small" for production balance
  model_size: "small"

  # Device for model inference
  # Options: "cpu", "cuda" (requires NVIDIA GPU + CUDA)
  # Note: CPU mode is slower but works everywhere
  model_device: "cpu"

  # Keep model in memory between runs
  # true = faster for batch processing, uses more RAM
  # false = reload each time, saves RAM
  model_in_memory: false

  # Directory for downloaded Whisper models
  # Models are cached here after first download (~1-3GB per model)
  model_download_root: "~/.cache/whisper_models"
