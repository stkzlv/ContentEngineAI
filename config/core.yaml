# ContentEngineAI Core Configuration
# Global settings shared across video production and scraping systems

# ============================================================================
# GLOBAL OUTPUT CONFIGURATION
# ============================================================================

# Base directory for ALL outputs (videos, logs, scraped data, intermediate files)
global_output_directory: "outputs"

# Global debug mode - can be overridden by CLI flags
debug_mode: false

# Total pipeline execution timeout in seconds (applies to both video and scraper).
#
# What makes it binding is machine contention and script length, not the
# hardware class. Measured on one 16-core box, idle, for a 33.4s voiceover:
# assembly 152s, subtitles 67s, visuals 52s, caption burn 27s, voiceover 18s,
# script 10s, 327s end to end. The same steps on a loaded machine with a 59s
# voiceover measured 671s for subtitles and 543s for assembly, so contention
# alone accounts for roughly 5.6x on transcription and 3.6x on assembly, and
# Whisper's cost scales with audio length against a budget that does not.
# The worst run observed came to about 1725s, which the shipped 900 lost
# twice in one day. 2700 is roughly 1.6x that.
#
# Raising this alone is not enough: `final_assembly_timeout_sec` sits inside
# it, so whichever is smaller binds first.
pipeline_timeout_sec: 2700

# Duration after voiceover ends for music fade-out (seconds)
# Creates a smooth ending where background music fades out gracefully
# Also prevents last word truncation from AAC encoding frame alignment
outro_duration_sec: 1.0

# ============================================================================
# SYSTEM TIMEOUTS (seconds)
# ============================================================================
# Short timeouts for system commands and validation operations.
# These are conservative defaults; increase if on slow hardware.
system_timeouts:
  ffprobe_timeout: 10        # Video metadata extraction
  xrandr_timeout: 5          # Display detection (Linux)
  system_profiler_timeout: 10  # System info (macOS)
  head_request_timeout: 10   # URL validation requests

# ============================================================================
# OUTPUT STRUCTURE (Video Production)
# ============================================================================
output_structure:
  # Product-centric organization: outputs/{product_id}/
  product_directory_pattern: "{product_id}"
  
  # Per-product files (all in product root)
  product_files:
    scraped_data: "data.json"
    script: "script.txt"
    description: "description.txt"
    voiceover: "voiceover.wav"
    subtitles: "subtitles.srt"
    final_video: "video_{product_id}_{profile}.mp4"
    metadata: "metadata.json"
    ffmpeg_log: "ffmpeg_command.log"
    performance: "performance.json"

# ============================================================================
# SCRAPER CONFIGURATION
# ============================================================================
# NOTE: Scraper-specific settings are in config/scraper.yaml
# This includes: output_config, retry_config, rate_limiting, image_config,
# video_config, download_config, validation_config, browser_config, etc.

# ============================================================================
# GLOBAL CLEANUP AND DIRECTORIES
# ============================================================================

# Global cleanup settings
cleanup:
  remove_temp_on_success: true
  keep_temp_on_failure: true
  cache_max_age_hours: 168  # 7 days

# Global directories (shared across all products and systems)
global_dirs:
  cache: "cache"
  logs: "logs" 
  reports: "reports"
  temp: "temp"

# Path configuration
path_config:
  # Directory names within each product directory
  subdirs:
    media: "media"
    images: "images"
    videos: "videos"
    temp: "temp"
    audio: "audio"
  
  # File extensions for cleanup
  temp_extensions: [".tmp", ".temp", ".processing", ".log"]
  
  # Image formats for media processing  
  image_extensions: [".jpg", ".jpeg", ".png", ".webp", ".gif"]
  video_extensions: [".mp4", ".mov", ".avi", ".webm", ".mkv"]
  audio_extensions: [".wav", ".mp3", ".aac", ".flac", ".ogg"]
