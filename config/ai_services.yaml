# ContentEngineAI AI Services Configuration  
# LLM, TTS, speech processing, and text analysis configuration

# ============================================================================
# LLM SETTINGS
# ============================================================================
llm_settings:
  # LLM provider service
  provider: "openrouter"
  
  # Environment variable containing API key
  api_key_env_var: "OPENROUTER_API_KEY"
  
  # Whether to automatically select free models when available
  auto_select_free_model: true
  
  # List of LLM models to try (in priority order)
  models:
    - "openai/gpt-3.5-turbo"
    - "deepseek/deepseek-chat-v3-0324:free"
    - "meta-llama/llama-3-8b-instruct:free"
  
  # API base URL for LLM provider
  base_url: "https://openrouter.ai/api/v1"
  
  # Target audience description for script personalization
  target_audience: "Tech-savvy young adults"
  
  # Path to prompt template file for script generation
  prompt_template_path: "src/ai/prompts/video_script.md"
  
  # Maximum tokens for LLM response
  max_tokens: 350
  
  # Temperature for text generation (0.0 = deterministic, 1.0 = creative)
  temperature: 0.7
  
  # Request timeout in seconds
  timeout_seconds: 90

  # Retry configuration
  retry_attempts: 5
  retry_min_wait_sec: 2
  retry_max_wait_sec: 30

# ============================================================================
# TTS CONFIGURATION
# ============================================================================
# NOTE: TTS configuration has been moved to config/subtitles.yaml
# See subtitles.yaml for all text-to-speech settings

# ============================================================================
# DESCRIPTION SETTINGS
# ============================================================================
description_settings:
  enabled: true
  prompt_template_path: "src/ai/prompts/video_description.md"
  target_platforms: ["tiktok", "youtube", "instagram"]
  max_tokens: 200

  # Target platform for metadata generation
  # Options: "youtube", "tiktok", "instagram", "multi" (all platforms)
  # When set to specific platform, generates optimized metadata for that platform only
  # "multi" generates metadata for all three platforms simultaneously
  target_platform: "multi"

  # Platform-specific metadata settings
  # If null, uses legacy unified description mode for backward compatibility
  # Set enabled: true to use platform-optimized titles, captions, and hashtags
  # Full platform-specific settings defined in platform_metadata_config section below
  platform_metadata:
    enabled: true
    target_platform: "multi"
    youtube:
      enabled: true
      title_length_max: 60
      description_length_max: 5000
      hashtag_count_min: 3
      hashtag_count_max: 5
      include_shorts_tag: true
      seo_keywords: true
    tiktok:
      enabled: true
      caption_length_optimal: 150
      caption_length_max: 2200
      hashtag_count_min: 3
      hashtag_count_max: 5
      avoid_generic_viral_tags: true
      prioritize_search_keywords: true
    instagram:
      enabled: true
      caption_style: "seo"
      caption_length_short_max: 30
      caption_length_seo_max: 200
      hashtag_count_min: 15
      hashtag_count_max: 30
      hashtags_in_caption: true
      emoji_enabled: true

# ============================================================================
# PLATFORM METADATA SETTINGS (Advanced)
# ============================================================================
# Platform-specific metadata optimization for YouTube, TikTok, and Instagram
# Based on 2025 algorithm best practices and SEO research
#
# Pipeline Impact:
# - Enables platform-specific title/description/hashtag generation
# - Overrides unified description mode when enabled
# - Generates separate metadata files per platform (metadata_youtube.json, etc.)
# - Maintains backward compatibility when disabled (platform_metadata: null)
#
# Usage:
# - Set description_settings.platform_metadata to {} to enable
# - Configure target_platform to control which platforms to generate for
# - Adjust per-platform settings to match your content strategy
platform_metadata_config:
  # Global enable/disable for platform-specific metadata generation
  # When false, falls back to legacy unified description mode
  enabled: true

  # Target platform(s) for metadata generation
  # Options: "youtube", "tiktok", "instagram", "multi"
  # This can be overridden per video profile or via CLI arguments
  target_platform: "multi"

  # ---- YouTube Settings ----
  # Optimized for YouTube Shorts discovery and search ranking
  # Key factors: Front-loaded keywords, #Shorts tag, 3-5 targeted hashtags
  youtube:
    enabled: true

    # Maximum title length (characters)
    # YouTube allows 100 chars, but 50-60 is optimal for mobile display
    # SEO best practice: Place primary keywords in first 50 characters
    # Recommendation: Keep titles punchy and keyword-rich for Shorts
    title_length_max: 60

    # Maximum description length (characters)
    # YouTube allows 5000 chars, but first 150 are shown without "Show more"
    # SEO best practice: Front-load important info and keywords in first 150 chars
    # Include call-to-action, product links, and detailed info after
    description_length_max: 5000

    # Hashtag count range (min-max)
    # YouTube recommends 3-5 hashtags maximum for best performance
    # Too many hashtags (>15) can result in all hashtags being ignored
    # Focus on niche-specific tags rather than generic viral tags
    hashtag_count_min: 3
    hashtag_count_max: 5

    # Automatically include #Shorts hashtag for vertical videos <60 seconds
    # Critical for YouTube Shorts discovery and recommendation algorithm
    # Set to false if manually managing hashtags or creating long-form content
    include_shorts_tag: true

    # Enable SEO keyword optimization in title and description
    # Places high-value search terms at beginning of title
    # Incorporates exact search phrases in first 150 chars of description
    # Recommended: true for maximum discoverability
    seo_keywords: true

  # ---- TikTok Settings ----
  # Optimized for TikTok's search-engine model (2024+ algorithm shift)
  # Key factors: Exact search phrases, niche hashtags, avoid generic viral tags
  tiktok:
    enabled: true

    # Optimal caption length for engagement (characters)
    # TikTok allows 2200 chars, but 100-300 is optimal for readability
    # Algorithm favors concise, searchable captions over creative hooks
    # Use exact search phrases (e.g., "morning skincare routine") vs creative text
    caption_length_optimal: 150

    # Maximum caption length (characters)
    # Hard limit imposed by TikTok platform
    # Exceeding this will cause caption truncation
    caption_length_max: 2200

    # Hashtag count range (min-max)
    # TikTok performs best with 3-5 targeted, niche-specific hashtags
    # Avoid overusing hashtags - quality over quantity
    # Mix of trending niche tags + evergreen category tags works best
    hashtag_count_min: 3
    hashtag_count_max: 5

    # Enable SEO-focused caption style
    # true = Use exact search phrases and keywords
    # false = Allow more creative, hook-based captions
    # 2025 best practice: true (TikTok is now a search engine)
    seo_focused: true

    # Generic hashtags to avoid
    # These tags are overused and provide no discovery value
    # Algorithm may even penalize content using only generic viral tags
    # Focus on niche community hashtags instead (e.g., #TechReview vs #FYP)
    avoid_generic_tags:
      - "foryoupage"
      - "fyp"
      - "viral"
      - "foryou"

  # ---- Instagram Settings ----
  # Optimized for Instagram Reels discovery and engagement
  # Key factors: 15-30 hashtags in caption (not comments), dual caption styles
  instagram:
    enabled: true

    # Caption style for Instagram Reels
    # Options: "short" (3-5 words, ultra-concise) or "seo" (100-200 chars, keyword-rich)
    # "short" = Trend-following, minimal text (e.g., "This changed everything ✨")
    # "seo" = Search-optimized, descriptive (e.g., "Best wireless earbuds under $50 for workouts")
    # Recommendation: "seo" for product content, "short" for viral trends
    caption_style: "seo"

    # Caption length for "short" style (characters)
    # Ultra-brief captions that hook viewers immediately
    # Typically 3-5 words or 10-15 characters
    # Works well with emoji and strong visual content
    caption_length_short: 15

    # Caption length for "seo" style (characters)
    # Descriptive captions with keywords for search discovery
    # 100-200 characters provides context while staying readable
    # Include value proposition and keywords for Instagram search
    caption_length_seo: 200

    # Hashtag count range (min-max)
    # Instagram allows 30 hashtags and actively encourages using 15-30
    # CRITICAL: Place hashtags IN CAPTION, not in comments (algorithm change)
    # Mix trending, niche, and evergreen hashtags for maximum reach
    # Formula: 5-10 high-volume + 10-15 niche + 5-10 branded/specific
    hashtag_count_min: 15
    hashtag_count_max: 30

    # Enable emoji usage in captions and hashtags
    # Emojis increase engagement and visual appeal on Instagram
    # Use strategically to break up text and add personality
    # Recommended: true for lifestyle/consumer products
    emoji_enabled: true

# ============================================================================
# WHISPER SETTINGS (Speech-to-Text)
# ============================================================================
whisper_settings:
  # Whether Whisper is available for subtitle generation
  enabled: true

  # Whisper model size balancing accuracy vs speed/memory
  # "tiny" = fastest, least accurate, "small" = balanced
  # "medium" = better accuracy, "large" = best accuracy, slowest
  model_size: "small"

  # Device for Whisper processing
  # "cpu" = use CPU (compatible), "cuda" = use GPU (faster if available)
  model_device: "cpu"

  # Whether to keep model in memory between uses
  model_in_memory: false

  # Directory for downloading Whisper models
  # Empty = use default cache directory (~/.cache/whisper)
  model_download_root: ""

  # Temperature for Whisper transcription (0.0 to 1.0)
  temperature: 0.0

  # Language code for transcription
  language: "en"

  # Beam size for Whisper search algorithm
  beam_size: 5

  # Whether to use 16-bit floating point precision
  fp16: false

  # Threshold for compression ratio to detect repetitive text
  compression_ratio_threshold: 2.4

  # Threshold for log probability to filter low-confidence words
  logprob_threshold: -1.0

  # Threshold for detecting silence vs speech
  # Lowered from 0.5 to 0.2 to capture speech with background noise
  no_speech_threshold: 0.2

  # Whether to use previous text context for better accuracy
  condition_on_previous_text: true

  # Whisper task type: "transcribe" or "translate"
  task: "transcribe"

  # Patience parameter for beam search (null = auto)
  patience: null

  # Timeout settings for Whisper processing
  base_timeout_sec: 120
  duration_multiplier: 6.0  # Increased from 3.0 for reliable transcription
  max_timeout_sec: 900  # Increased from 600 for longer audio

  # Progress monitoring interval in seconds
  progress_monitor_interval_sec: 30

  # Enable detailed resource monitoring during transcription
  enable_resource_monitoring: true

  # Enable automatic resource cleanup after processing
  enable_resource_cleanup: true

# ============================================================================
# AUDIO PROCESSING SETTINGS
# ============================================================================
audio_processing:
  # Enable/disable Coqui TTS GPU acceleration
  coqui_gpu_enabled: false

  # Audio encoding for Google TTS output
  google_tts_audio_encoding: "LINEAR16"

  # Minimum valid audio file size in bytes
  min_audio_file_size_bytes: 100

  # Timeout for audio validation operations
  audio_validation_timeout_sec: 30

  # ---- Silence Removal Settings ----
  # These settings control automatic silence trimming from TTS-generated voiceovers
  # CRITICAL: Ensures Whisper STT timestamps align with actual audio
  # Whisper normalizes timestamps to start at 0 (first detected speech)
  # Without trimming, subtitles will appear before actual speech starts

  # Enable/disable silence trimming (RECOMMENDED: true)
  silence_removal_enabled: true

  # Silence detection threshold in decibels
  # Lower values = more sensitive (detects quieter silence)
  # -40dB catches most background silence while preserving speech
  # Range: -60 (very sensitive) to -20 (only very quiet silence)
  silence_threshold_db: -40

  # Minimum duration to consider as silence (seconds)
  # Prevents removing very brief pauses between words
  # 0.1s = 100ms is optimal for natural speech cadence
  silence_min_duration_sec: 0.1

