# ContentEngineAI AI Services Configuration  
# LLM, TTS, speech processing, and text analysis configuration

# ============================================================================
# LLM SETTINGS
# ============================================================================
llm_settings:
  # LLM provider: "gemini" or "openrouter"
  provider: "gemini"

  # Environment variable containing API key
  api_key_env_var: "GEMINI_API_KEY"

  # Models to try (in priority order)
  models:
    - "gemini-2.5-flash-lite"

  # Gemini doesn't need free model discovery or fallback
  auto_select_free_model: false
  random_model_selection: false
  fallback_discover_any_free: false

  # Target audience description for script personalization
  target_audience: "Tech-savvy young adults"

  # Path to prompt template file for script generation
  prompt_template_path: "src/ai/prompts/video_script.md"

  # Maximum tokens for LLM response
  max_tokens: 600

  # Temperature for text generation (0.0 = deterministic, 1.0 = creative)
  temperature: 0.7

  # Request timeout in seconds
  timeout_seconds: 60

  # Gemini only. 0 disables the model's internal reasoning pass; remove the
  # key to leave the model's own default in place.
  #
  # The flash tier spends hundreds of thinking tokens on a task whose
  # visible output is sixteen, which is where the fortyfold gap between the
  # lite and flash tiers comes from -- not the headline rate. Nothing this
  # pipeline asks for is a reasoning problem: a script of about a hundred and
  # twenty words, a caption, a handful of stock-search phrases. The lite
  # models configured below do no thinking anyway, so this changes nothing
  # today; it is what keeps a switch to a flash model from silently costing
  # forty times more -- but only on the 2.5 flash tier, where the knob works
  # (measured on one tagging prompt: 556 without it, none with it). The 3.x flash
  # models ignore it: `thinking_level: low` is their floor and still bills.
  # Switching `models:` above to a 3.x flash model is a cost decision this
  # setting cannot soften.
  #
  # Disabling thinking does not guarantee the model omits a preamble, so the
  # per-generator sanitisers still apply.
  thinking_budget: 0

  # Retry configuration for LLM API calls
  retry_attempts: 5
  retry_min_wait_sec: 2
  retry_max_wait_sec: 30

  # OpenRouter model discovery filters
  model_blocklist:
    - "liquid/lfm-2.5-1.2b-instruct:free"
    - "liquid/lfm-2.5-1.2b-instruct"
  min_context_length: 8000  # Skip models with context < this (proxy for model size)

  # Script validation thresholds
  script_validation:
    min_chars: 200
    min_words: 50

  # Description validation thresholds. The floors alone cannot tell a
  # description from a reasoning model's monologue about writing one: that
  # text is longer and wordier than a real description, so it clears every
  # floor by a wide margin, and one was published as a video description
  # (#404). max_chars is measured rather than chosen: real descriptions from
  # this pipeline ran 244-430 characters against a prompt asking for 150-300,
  # while the chain-of-thought outputs ran 1346-2686. Raising it past about
  # 1300 puts the two back in the same band.
  description_validation:
    min_chars: 50
    min_words: 10
    max_chars: 900

  # Stock search phrases taken from the finished script. Only consulted by a
  # profile that draws every visual from stock (slideshow_stock), where the
  # search terms are the whole visual layer. Each phrase is searched
  # separately, so max_phrases is how many different shots a render draws on.
  visual_search_terms:
    enabled: true
    max_phrases: 3
    max_words_per_phrase: 5

  # Every candidate the library returns for a phrase is scored 0-3 against
  # the script by the multimodal model, judging the thumbnail rather than the
  # caption, and the best-scoring are the ones downloaded. Measured on #341:
  # provider rank is noise for a concrete subject (fits at a median rank
  # near 45 of 80) and fits are scarce for an abstract one (three or four
  # per pool); a judge over the whole pool finds them in both cases where a
  # random sample of eight expects none. Below min_score a candidate is used
  # only when there are not enough above it, so the judge shortens nothing.
  # A failed judgement leaves the random sample in place.
  stock_relevance:
    enabled: true
    model: "gemini-2.5-flash-lite"
    min_score: 2
    max_candidates: 80
    concurrency: 6
    timeout_seconds: 20

  # One grounded query per topic script, asking which falsifiable claims are
  # wrong and how. Re-measured head to head over one 17-script pool corpus:
  # the 3.x flash tier flagged 8 claims with 7 right on hand review, against
  # the 2.5 tier's 14 with roughly 9 right -- fewer, better flags -- and it
  # caught two real fabrications the 2.5 tier missed outright, an invented
  # settings path and an outdated interface claim, which is the class the
  # check exists for. It also ran a 4.5s median against 10.5s and spent
  # fewer thinking tokens (median 652 against 1773; that budget is not a
  # knob on this tier, so the spend is measured, not configured). A
  # rejected revision ships the original; nothing here can lose a render.
  #
  # A flash model rather than the lite tier the other blocks use, and
  # `thinking_budget: 0` is deliberately NOT applied. This is the one
  # reasoning-shaped call the pipeline makes, and the lite tier does no
  # grounding. Do not "align" it with llm_settings.thinking_budget.
  #
  # Grounding plus response_schema does combine on this tier (it refused
  # with 400 on 2.5), but the prompt still asks for labelled lines and the
  # parser keeps its labelled fallback: the JSON-first parse costs nothing
  # and a model swap back must not become a code change.
  #
  # 45s against a 4.5s median (17.5s max) because a grounded call has a
  # search round trip inside it, which no generation timeout on this repo
  # accounts for. Do not tighten it to match the observed number.
  #
  # The two arms are different instruments, chosen by the record's kind: a
  # topic script gets one grounded query, a product script is ruled against
  # the scraped listing already in hand, ungrounded -- a web search resolves
  # a product claim to a different SKU, a review or a successor model, so it
  # would both flag correct copy and bless wrong copy. `products` switches
  # the listing arm on; price claims are excluded there because price moves
  # after scraping.
  script_fact_check:
    enabled: true
    model: "gemini-3.7-flash"
    products: true
    max_flags_to_revise: 3
    max_length_drift: 0.25
    timeout_seconds: 45

  # Topic scripts written from a sourced step list (design 0017). One
  # grounded call returns each step's action, exact UI path, expected
  # result and source URL; a step without a source is refused and its topic
  # dropped (a missing step leaves a tutorial no one can follow), and a topic
  # that forks by device or needs more than max_steps is set aside for a
  # series. The script's length follows the step count. Off until the
  # reach-test readout.
  topic_scripts:
    step_list:
      enabled: false
      model: "gemini-3.7-flash"
      max_steps: 6
      timeout_seconds: 60

  # Fallback provider: used when primary provider exhausts all models
  fallback_provider:
    provider: "openrouter"
    api_key_env_var: "OPENROUTER_API_KEY"
    base_url: "https://openrouter.ai/api/v1"
    prompt_template_path: "src/ai/prompts/video_script.md"
    auto_select_free_model: true
    fallback_discover_any_free: true
    max_tokens: 600
    temperature: 0.7
    timeout_seconds: 60
    models:
      - "tngtech/deepseek-r1t2-chimera:free"
      - "arcee-ai/trinity-large-preview:free"
      - "z-ai/glm-4.5-air:free"
      - "nvidia/nemotron-3-nano-30b-a3b:free"
      - "tngtech/deepseek-r1t-chimera:free"
      - "tngtech/tng-r1t-chimera:free"

  # Script template system
  # Templates control the style/structure of generated scripts
  # Each product gets a template selected deterministically by product ID
  script_templates:
    enabled: true
    # Directory containing template .md files
    templates_dir: "src/ai/prompts/scripts"
    # Pool of template names to use (empty = all templates in directory)
    # Example: ["curiosity_hook", "problem_solution", "story_driven"]
    template_pool: []
    # Override: use this specific template for all products
    # Takes priority over random selection. Set null for random.
    # Example: "curiosity_hook"
    fixed_template: null
    # Force one closing line for every record; null selects per record.
    fixed_cta: null
    # Pillar -> list of template names. See docs/requirements/content.md, "Content pillars".
    # When a run is scoped to a pillar, deterministic per-product selection picks
    # from this list instead of the full pool. A template can fit more than one
    # pillar; list it under each. Empty dict disables pillar filtering.
    pillars:
      value:
        - classic_promo
        - rapid_fire
        - social_proof
        - myth_buster
        - comparison
        - skeptic_converted
      novelty:
        - classic_promo
        - curiosity_hook
        - secret_reveal
        - story_driven
        - unboxing_reaction
        - skeptic_converted
      utility:
        - classic_promo
        - before_after
        - comparison
        - lifestyle_flex
        - myth_buster
        - problem_solution
        - question_driven
        - challenge_dare
    # Channel-wide voice direction prepended to every script prompt above any
    # pillar preamble. Carries the rules every template would otherwise repeat
    # (banned words, word target, narrator persona, anti-AI-tells). Override
    # this in a gitignored config layer to add a channel-specific persona.
    # Empty string disables narrator profile injection.
    narrator_profile: |-
      Narrator profile: every video on this channel is voiced by the same person. Keep that voice consistent across all templates.

      Who: one creator, not a brand. Use "I", not "we". Helpful first, recommender second. The viewer should feel like they're getting a tip from a friend who has done the legwork, not pitched at.

      Voice: calm, conversational, friendly. Slightly understated. Not slick, not loud, not announcer-perfect. The tone you'd use telling a friend about something you bought.

      Specificity: drop one concrete detail per script. A real moment, a real number, a real reference. "Charged it Sunday, forgot about it until Friday" beats "great battery life."

      Imperfection: sentence fragments, contractions, one mild filler word ("so", "okay") per script are fine. None at all reads too clean. Vary sentence length. Mix one short punchy line with one longer compound sentence.

      CTA: the script ends on the exact call to action the template gives you, word for word. There is one, and it is chosen for you.

      Things to avoid because they read as AI:
      - Connectors: "Moreover", "Furthermore", "Additionally", "What's more", "It's worth noting", "It's important to note".
      - Empty intensifiers used as filler: "incredibly", "absolutely", "literally", "honestly".
      - Three parallel adjectives or three parallel short phrases in a row.
      - Paragraph structure that always ends on a tidy takeaway sentence.
      - Three consecutive sentences starting with the same word.
      - Generic summary closers: "In essence", "Ultimately", "At the end of the day".
      - Stacked hedges: "might possibly potentially".

      Voice example (the voice, not the ending -- it stops before the close
      on purpose, so it demonstrates neither a closing beat nor a call to
      action; the template's own rules own both):

      So I picked this up last month and figured I'd share. It's a small thing, fits in your jacket pocket, but the magnetic mount actually grips. Took it on a hike and never lost signal.

      Universal rules:
      - Write the actual spoken words only. No stage directions or camera notes.
      - Target 30-40 seconds at normal speaking pace (roughly 75-100 words).
      - No emojis, no hashtags, no greetings like "hey guys", no markdown in the output.
      - Name the product the way a person would say it out loud, not the way it is listed. Never speak a model or SKU designation (letter-number codes like "P1", "3DP13D", "Q30", "240D"). Prefer the plain category noun, optionally with the brand: "this 3D pen", "the Anker charger". Use the short alias from the product data block only when it already reads as a name a person would say; if it is a fragment or carries a model code, use the category noun instead. Never read the full official title.
      - Plain text only, suitable for direct text-to-speech.
      - Do not mention the product price.
      - Banned phrases: "game changer", "next-level", "ultimate", "must-have", "revolutionary", "immerse yourself".
      - If the product description contains any banned phrase or marketing fluff, paraphrase the underlying feature in your own words. Don't quote it.
    # The closing calls to action. Every script ends on exactly one of these,
    # verbatim. They live here rather than as prose in the narrator profile
    # because prose forty lines from the task did not bind: five of five
    # scheduled renders ended on the template's closing beat and never reached
    # a CTA. Each template renders these into its own Rules, next to the beat
    # that precedes them, and the generator refuses a script that does not end
    # on one. Edit the list, not the templates.
    #
    # One is chosen per product, by the same salted hash the script template,
    # the font, the colour and the voice use, and only that one is rendered
    # into the rule. Quoting all four and letting the model pick meant it
    # picked the first every time: five of five product scripts on one day
    # and all four on the next day's batches closed on the same line, which
    # is the templated-sameness signal the platforms throttle on. Validation
    # still accepts any line in the list, since a script that reached for a
    # sibling has still closed on a CTA. `--cta` overrides the choice.
    cta_options:
      - "Link in bio if you want one."
      - "Follow for more finds like this."
      - "Drop a comment if you've tried it."
      - "Share with someone who needs this."
    # For topic renders, which have nothing to buy.
    cta_options_topic:
      - "Follow for more fixes like this."
      - "Drop a comment if this worked."
      - "Share it with whoever needs it."
      - "Save this for the next time it happens."
    # Conversational delivery written into the script: contractions, spoken
    # fillers ("so", "okay") and one emotional beat; at 2 also one
    # self-correction. Never in the first sentence, a number, name or claim,
    # or the CTA. 0 = off, and the prompt is unchanged. Held at 0 while the
    # reach test runs: it changes the treatment arm's script.
    naturalism:
      intensity: 0
    # Recurring author signature: each pool is drawn per product at use_rate,
    # independently. The opener starts the first sentence, the transition is
    # used once mid-script, the sign-off is spoken right before the CTA. Empty
    # pools = off, and held off while the reach test runs.
    signature:
      use_rate: 0.5
      openers: []
      transitions: []
      signoffs: []

    # Templates used when the record came from a topic rather than a scraped
    # product. These replace the pool rather than narrowing it: every other
    # template is written to pitch a product, so leaving one reachable means a
    # topic occasionally renders as an advertisement for a subject.
    topic_templates:
      - topic_answer_first
      - topic_symptom_cause
      - topic_mistake_fix

    # Narrator direction for topic scripts. The default profile below is
    # written for someone describing a thing they bought, down to its CTA list,
    # which is where "Link in bio if you want one" comes from. A topic script
    # has no product behind that, so it needs its own voice.
    narrator_profile_topic: |-
      Narrator profile: every video on this channel is voiced by the same person. Keep that voice consistent.

      Who: one person who has fixed this before, explaining it to someone who has not. Use "I" sparingly and "you" often. The viewer came with a problem; the job is to solve it, not to be interesting.

      Voice: calm, plain, unhurried. The tone of talking someone through it over the phone. Not a presenter, not a brand.

      Specificity: concrete beats vague. "Change the channel to 1, 6, or 11" beats "adjust your settings". Name a menu path or a URL only if you can state it exactly for a platform you name; a wrong path costs more than a general one.

      Imperfection: contractions and sentence fragments are fine. Vary sentence length. One mild filler word per script at most.

      CTA: the script ends on the exact call to action the template gives you, word for word. There is one, it is chosen for you, and it never implies something to buy.

      Things to avoid because they read as AI:
      - Connectors: "Moreover", "Furthermore", "Additionally", "What's more", "It's worth noting".
      - Empty intensifiers: "incredibly", "absolutely", "literally", "honestly".
      - Three parallel adjectives or three parallel phrases in a row.
      - Generic closers: "In essence", "Ultimately", "At the end of the day".
      - Three consecutive sentences starting with the same word.

      Voice example (the voice, not the ending -- it stops before the close
      on purpose, so it demonstrates neither a closing beat nor a call to
      action; the template's own rules own both):

      If your wifi drops every evening, it is almost always the channel, not the router. Open the admin page, find the 2.4 gigahertz channel setting, and put it on 1, 6, or 11. Those three do not overlap; everything else does. Evening is when your neighbours all come home and crowd the same band.

      Universal rules:
      - Write the actual spoken words only. No stage directions or camera notes.
      - Target 30-40 seconds at normal speaking pace (roughly 75-100 words).
      - No emojis, no hashtags, no greetings, no markdown in the output.
      - Plain text only, suitable for direct text-to-speech.
      - Never imply the viewer should buy something unless the topic detail names a specific tool. No "this thing", no "I picked one up", no "if you want one".
      - Do not invent a product, a brand, or a price. If the detail does not name one, there is not one.
      - Banned phrases: "game changer", "next-level", "ultimate", "must-have", "revolutionary".

    # Pillar -> preamble string prepended to the LLM prompt at runtime, after
    # the narrator profile. Templates stay pillar-agnostic; the preamble nudges
    # the LLM toward the pillar's framing angle. Empty dict disables it.
    pillar_preambles:
      value: |-
        Pillar context: this video runs under the value pillar. Lean into the deal-pitch angle, where the product feels accessible and packs more punch than its price suggests. If the product fits another angle better, follow the product.
      novelty: |-
        Pillar context: this video runs under the novelty pillar. Lean into the discovery angle, framing the product as something the viewer hasn't seen before. If the product fits another angle better, follow the product.
      utility: |-
        Pillar context: this video runs under the utility pillar. Lean into the problem-solving angle, where the product fixes a specific, real-world annoyance the viewer would recognize. If the product fits another angle better, follow the product.
    # Pillar -> target-audience override. When a pillar is set at runtime,
    # the {AUDIENCE} placeholder in templates uses this value instead of the
    # global target_audience. Lets each pillar speak to its actual buyer.
    pillar_audiences:
      value: "Budget-conscious shoppers looking for products that punch above their price."
      novelty: "Curious people who enjoy discovering lesser-known products before everyone else."
      utility: "Practical buyers solving a real, recurring problem with the right tool."

    # Topic counterparts. The maps above are written about a product being
    # shown, so pairing one with a topic template gives the model a prompt
    # that argues with itself: the template says never invent a product, the
    # preamble assumes one exists. Same keys, so --pillar takes the same
    # values on both families.
    pillar_preambles_topic:
      value: |-
        Pillar context: this video runs under the value pillar. Lean into the free-or-cheap angle, where the fix costs nothing but a few minutes and the viewer already owns everything they need. If the topic fits another angle better, follow the topic.
      novelty: |-
        Pillar context: this video runs under the novelty pillar. Lean into the did-not-know-that angle, framing the cause as something the viewer has lived with without ever knowing why. If the topic fits another angle better, follow the topic.
      utility: |-
        Pillar context: this video runs under the utility pillar. Lean into the problem-solving angle, where a specific, recurring annoyance the viewer would recognize gets diagnosed and fixed. If the topic fits another angle better, follow the topic.
    pillar_audiences_topic:
      value: "People who would rather fix it themselves than pay for a fix or a replacement."
      novelty: "Curious people who like knowing why their devices behave the way they do."
      utility: "Practical people troubleshooting a specific, recurring annoyance right now."

# ============================================================================
# TTS CONFIGURATION
# ============================================================================
# NOTE: TTS configuration has been moved to config/subtitles.yaml
# See subtitles.yaml for all text-to-speech settings

# ============================================================================
# DESCRIPTION SETTINGS
# ============================================================================
description_settings:
  enabled: true
  prompt_template_path: "src/ai/prompts/video_description.md"
  target_platforms: ["tiktok", "youtube", "instagram"]
  max_tokens: 200

  # Metadata mode: "unified" (single file) or "optimized" (platform-specific files)
  # "unified" - single metadata.json with AI description + auto-generated hashtags
  # "optimized" - separate metadata_youtube.json, etc. with platform-specific AI content
  metadata_mode: "unified"

  # Platform-specific metadata settings
  # If null, uses legacy unified description mode for backward compatibility
  # enabled: false falls back to unified mode; each platform block has its own
  # enabled switch for metadata_mode: optimized
  platform_metadata:
    enabled: true
    # Metadata caching
    cache:
      enabled: true
      ttl_hours: 24
      cache_dir: ".cache/platform_metadata"
      max_entries: 1000
    # Trend-aware hashtags
    trends:
      enabled: false
      provider: "static"
      cache_ttl_hours: 4
      max_trending_tags: 2
      fallback_tags:
        youtube: ["#Shorts", "#Trending", "#Tech", "#Gadgets", "#Review"]
        tiktok: ["#ForYou", "#Viral", "#LifeHack", "#Shopping", "#TechTok"]
        instagram: ["#Reels", "#InstaGood", "#Innovation", "#Gadget", "#TechLife"]
    youtube:
      enabled: true
      title_length_max: 60
      description_length_max: 5000
      hashtag_count_min: 3
      hashtag_count_max: 5
      include_shorts_tag: true
    tiktok:
      enabled: true
      caption_length_optimal: 150
      caption_length_max: 2200
      hashtag_count_min: 3
      hashtag_count_max: 5
    instagram:
      enabled: true
      caption_style: "seo"
      hashtag_count_min: 15
      hashtag_count_max: 30
      emoji_enabled: true

# ============================================================================
# WHISPER SETTINGS (Speech-to-Text)
# ============================================================================
whisper_settings:
  # Whether Whisper is available for subtitle generation
  enabled: true

  # Whisper model size balancing accuracy vs speed/memory
  # "tiny" = fastest, least accurate, "small" = balanced
  # "medium" = better accuracy, "large" = best accuracy, slowest
  model_size: "small"

  # Device for Whisper processing
  # "cpu" = use CPU (compatible), "cuda" = use GPU (faster if available)
  model_device: "cpu"

  # Whether to keep model in memory between uses
  model_in_memory: false

  # Directory for downloading Whisper models
  # Empty = use default cache directory (~/.cache/whisper)
  model_download_root: ""

  # Temperature for Whisper transcription (0.0 to 1.0)
  temperature: 0.0

  # Language code for transcription
  language: "en"

  # Beam size for Whisper search algorithm
  # Higher = better accuracy but slower processing
  # Range: 1 (fastest, greedy) to 10 (most accurate), default 5
  # Use 1-3 for fast drafts, 5 for balanced, 7-10 for final quality
  beam_size: 5

  # Whether to use 16-bit floating point precision
  fp16: false

  # Threshold for compression ratio to detect repetitive text
  # Lower values = more aggressive filtering of repeated phrases
  # Range: 1.5 (strict) to 3.5 (permissive), default 2.4
  # Increase if valid repetitive content is being filtered out
  compression_ratio_threshold: 2.4

  # Threshold for log probability to filter low-confidence words
  # More negative = more permissive (keeps lower confidence words)
  # Range: -2.0 (very permissive) to 0.0 (strict), default -1.0
  # Decrease if words are being dropped; increase if garbage text appears
  logprob_threshold: -1.0

  # Threshold for detecting silence vs speech
  # Lowered from 0.5 to 0.2 to capture speech with background noise
  no_speech_threshold: 0.2

  # Whether to use previous text context for better accuracy
  condition_on_previous_text: true

  # Whisper task type: "transcribe" or "translate"
  task: "transcribe"

  # Patience parameter for beam search
  # null = automatic (recommended), or 0.0-2.0 for manual control
  # Higher values explore more hypotheses before settling on answer
  # Only set if you understand beam search; null works well for most cases
  patience: null

  # Timeout settings for Whisper processing
  # The limit is derived from audio duration, which says nothing about how
  # fast this machine transcribes. Measured on 26.3s of audio: 268.5s idle and
  # 305.5s under load. At the old 6.0 multiplier the limit was 277.7s, so a
  # healthy machine had nine seconds of margin and any contention lost the
  # render -- and `make *-lowpri`, the documented way to run a batch, makes
  # transcription slower on purpose.
  base_timeout_sec: 120
  duration_multiplier: 15.0
  max_timeout_sec: 1800

  # A timeout arrives after the LLM script and the TTS voiceover are already
  # paid for, so one retry on a widened limit costs far less than the render
  # it saves. 0 restores the single attempt.
  timeout_retry_attempts: 1
  timeout_retry_multiplier: 2.0

  # Progress monitoring interval in seconds
  progress_monitor_interval_sec: 30

  # Enable detailed resource monitoring during transcription
  enable_resource_monitoring: true

  # Enable automatic resource cleanup after processing
  enable_resource_cleanup: true

# ============================================================================
# AUDIO PROCESSING SETTINGS
# ============================================================================
audio_processing:
  # Enable/disable Coqui TTS GPU acceleration
  coqui_gpu_enabled: false

  # Audio encoding for Google TTS output
  google_tts_audio_encoding: "LINEAR16"

  # ---- Silence Removal Settings ----
  # These settings control automatic silence trimming from TTS-generated voiceovers
  # CRITICAL: Ensures Whisper STT timestamps align with actual audio
  # Whisper normalizes timestamps to start at 0 (first detected speech)
  # Without trimming, subtitles will appear before actual speech starts

  # Enable/disable silence trimming (RECOMMENDED: true)
  silence_removal_enabled: true

  # Silence detection threshold in decibels
  # Lower values = more sensitive (detects quieter silence)
  # -50dB preserves quiet speech endings and trailing consonants
  # Range: -60 (very sensitive) to -20 (only very quiet silence)
  silence_threshold_db: -50

  # ffmpeg silenceremove start_duration: the confirmation window of
  # continuous non-silence the filter must see before it stops trimming.
  # Audio during this window is DISCARDED, not kept — so larger values
  # trim MORE aggressively, not less. If this is longer than a short
  # trailing word (e.g. "tips" at ~0.4s), that word is eaten by the
  # confirmation window. Keep at 0.1s or below.
  silence_min_duration_sec: 0.1

