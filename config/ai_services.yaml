# ContentEngineAI AI Services Configuration  
# LLM, TTS, speech processing, and text analysis configuration

# ============================================================================
# LLM SETTINGS
# ============================================================================
llm_settings:
  # LLM provider: "gemini" or "openrouter"
  provider: "gemini"

  # Environment variable containing API key
  api_key_env_var: "GEMINI_API_KEY"

  # Models to try (in priority order)
  models:
    - "gemini-2.5-flash-lite"

  # Gemini doesn't need free model discovery or fallback
  auto_select_free_model: false
  random_model_selection: false
  fallback_discover_any_free: false

  # Target audience description for script personalization
  target_audience: "Tech-savvy young adults"

  # Path to prompt template file for script generation
  prompt_template_path: "src/ai/prompts/video_script.md"

  # Maximum tokens for LLM response
  max_tokens: 600

  # Temperature for text generation (0.0 = deterministic, 1.0 = creative)
  temperature: 0.7

  # Request timeout in seconds
  timeout_seconds: 60

  # Retry configuration for LLM API calls
  retry_attempts: 5
  retry_min_wait_sec: 2
  retry_max_wait_sec: 30

  # OpenRouter model discovery filters
  model_blocklist:
    - "liquid/lfm-2.5-1.2b-instruct:free"
    - "liquid/lfm-2.5-1.2b-instruct"
  min_context_length: 8000  # Skip models with context < this (proxy for model size)

  # Script validation thresholds
  script_validation:
    min_chars: 200
    min_words: 50

  # Fallback provider: used when primary provider exhausts all models
  fallback_provider:
    provider: "openrouter"
    api_key_env_var: "OPENROUTER_API_KEY"
    base_url: "https://openrouter.ai/api/v1"
    prompt_template_path: "src/ai/prompts/video_script.md"
    auto_select_free_model: true
    fallback_discover_any_free: true
    max_tokens: 600
    temperature: 0.7
    timeout_seconds: 60
    models:
      - "tngtech/deepseek-r1t2-chimera:free"
      - "arcee-ai/trinity-large-preview:free"
      - "z-ai/glm-4.5-air:free"
      - "nvidia/nemotron-3-nano-30b-a3b:free"
      - "tngtech/deepseek-r1t-chimera:free"
      - "tngtech/tng-r1t-chimera:free"

  # Script template system
  # Templates control the style/structure of generated scripts
  # Each product gets a template selected deterministically by product ID
  script_templates:
    enabled: true
    # Directory containing template .md files
    templates_dir: "src/ai/prompts/scripts"
    # Pool of template names to use (empty = all templates in directory)
    # Example: ["curiosity_hook", "problem_solution", "story_driven"]
    template_pool: []
    # Override: use this specific template for all products
    # Takes priority over random selection. Set null for random.
    # Example: "curiosity_hook"
    fixed_template: null
    # Pillar -> list of template names. See docs/requirements.md "Content Pillars".
    # When a run is scoped to a pillar, deterministic per-product selection picks
    # from this list instead of the full pool. A template can fit more than one
    # pillar; list it under each. Empty dict disables pillar filtering.
    pillars:
      value:
        - classic_promo
        - rapid_fire
        - social_proof
        - myth_buster
        - comparison
        - skeptic_converted
      novelty:
        - classic_promo
        - curiosity_hook
        - secret_reveal
        - story_driven
        - unboxing_reaction
        - skeptic_converted
      utility:
        - classic_promo
        - before_after
        - comparison
        - lifestyle_flex
        - myth_buster
        - problem_solution
        - question_driven
        - challenge_dare
    # Channel-wide voice direction prepended to every script prompt above any
    # pillar preamble. Carries the rules every template would otherwise repeat
    # (banned words, word target, narrator persona, anti-AI-tells). Override
    # this in a gitignored config layer to add a channel-specific persona.
    # Empty string disables narrator profile injection.
    narrator_profile: |-
      Narrator profile: every video on this channel is voiced by the same person. Keep that voice consistent across all templates.

      Who: one creator, not a brand. Use "I", not "we". Helpful first, recommender second. The viewer should feel like they're getting a tip from a friend who has done the legwork, not pitched at.

      Voice: calm, conversational, friendly. Slightly understated. Not slick, not loud, not announcer-perfect. The tone you'd use telling a friend about something you bought.

      Specificity: drop one concrete detail per script. A real moment, a real number, a real reference. "Charged it Sunday, forgot about it until Friday" beats "great battery life."

      Imperfection: sentence fragments, contractions, one mild filler word ("so", "okay") per script are fine. None at all reads too clean. Vary sentence length. Mix one short punchy line with one longer compound sentence.

      CTA: pick one CTA, not a list. Options: "Link in bio if you want one." / "Follow for more finds like this." / "Drop a comment if you've tried it." / "Share with someone who needs this." Pick whichever fits the script.

      Things to avoid because they read as AI:
      - Connectors: "Moreover", "Furthermore", "Additionally", "What's more", "It's worth noting", "It's important to note".
      - Empty intensifiers used as filler: "incredibly", "absolutely", "literally", "honestly".
      - Three parallel adjectives or three parallel short phrases in a row.
      - Paragraph structure that always ends on a tidy takeaway sentence.
      - Three consecutive sentences starting with the same word.
      - Generic summary closers: "In essence", "Ultimately", "At the end of the day".
      - Stacked hedges: "might possibly potentially".

      Voice example (one short script that lands the voice end-to-end):

      So I picked this up last month and figured I'd share. It's a small thing, fits in your jacket pocket, but the magnetic mount actually grips. Took it on a hike and never lost signal. The battery is fine, not great. About six hours under load. If you want one, link in bio.

      Universal rules:
      - Write the actual spoken words only. No stage directions or camera notes.
      - Target 30-40 seconds at normal speaking pace (roughly 75-100 words).
      - No emojis, no hashtags, no greetings like "hey guys", no markdown in the output.
      - Name the product the way a person would say it out loud, not the way it is listed. Never speak a model or SKU designation (letter-number codes like "P1", "3DP13D", "Q30", "240D"). Prefer the plain category noun, optionally with the brand: "this 3D pen", "the Anker charger". Use the short alias from the product data block only when it already reads as a name a person would say; if it is a fragment or carries a model code, use the category noun instead. Never read the full official title.
      - Plain text only, suitable for direct text-to-speech.
      - Do not mention the product price.
      - Banned phrases: "game changer", "next-level", "ultimate", "must-have", "revolutionary", "immerse yourself".
      - If the product description contains any banned phrase or marketing fluff, paraphrase the underlying feature in your own words. Don't quote it.
    # Pillar -> preamble string prepended to the LLM prompt at runtime, after
    # the narrator profile. Templates stay pillar-agnostic; the preamble nudges
    # the LLM toward the pillar's framing angle. Empty dict disables it.
    pillar_preambles:
      value: |-
        Pillar context: this video runs under the value pillar. Lean into the deal-pitch angle, where the product feels accessible and packs more punch than its price suggests. If the product fits another angle better, follow the product.
      novelty: |-
        Pillar context: this video runs under the novelty pillar. Lean into the discovery angle, framing the product as something the viewer hasn't seen before. If the product fits another angle better, follow the product.
      utility: |-
        Pillar context: this video runs under the utility pillar. Lean into the problem-solving angle, where the product fixes a specific, real-world annoyance the viewer would recognize. If the product fits another angle better, follow the product.
    # Pillar -> target-audience override. When a pillar is set at runtime,
    # the {AUDIENCE} placeholder in templates uses this value instead of the
    # global target_audience. Lets each pillar speak to its actual buyer.
    pillar_audiences:
      value: "Budget-conscious shoppers looking for products that punch above their price."
      novelty: "Curious people who enjoy discovering lesser-known products before everyone else."
      utility: "Practical buyers solving a real, recurring problem with the right tool."

# ============================================================================
# TTS CONFIGURATION
# ============================================================================
# NOTE: TTS configuration has been moved to config/subtitles.yaml
# See subtitles.yaml for all text-to-speech settings

# ============================================================================
# DESCRIPTION SETTINGS
# ============================================================================
description_settings:
  enabled: true
  prompt_template_path: "src/ai/prompts/video_description.md"
  target_platforms: ["tiktok", "youtube", "instagram"]
  max_tokens: 200

  # Metadata mode: "unified" (single file) or "optimized" (platform-specific files)
  # "unified" - single metadata.json with AI description + auto-generated hashtags
  # "optimized" - separate metadata_youtube.json, etc. with platform-specific AI content
  metadata_mode: "unified"

  # Target platform for metadata generation
  # Options: "youtube", "tiktok", "instagram", "multi" (all platforms)
  # When set to specific platform, generates optimized metadata for that platform only
  # "multi" generates metadata for all three platforms simultaneously
  target_platform: "multi"

  # Platform-specific metadata settings
  # If null, uses legacy unified description mode for backward compatibility
  # Set enabled: true to use platform-optimized titles, captions, and hashtags
  # Full platform-specific settings defined in platform_metadata_config section below
  platform_metadata:
    enabled: true
    target_platform: "multi"
    # Metadata caching (see platform_metadata_config.cache for full settings)
    cache:
      enabled: true
      ttl_hours: 24
      cache_dir: ".cache/platform_metadata"
      max_entries: 1000
    # Trend-aware hashtags (see platform_metadata_config.trends for documentation)
    trends:
      enabled: false
      provider: "static"
      cache_ttl_hours: 4
      max_trending_tags: 2
      fallback_tags:
        youtube: ["#Shorts", "#Trending", "#Tech", "#Gadgets", "#Review"]
        tiktok: ["#ForYou", "#Viral", "#LifeHack", "#Shopping", "#TechTok"]
        instagram: ["#Reels", "#InstaGood", "#Innovation", "#Gadget", "#TechLife"]
    youtube:
      enabled: true
      title_length_max: 60
      description_length_max: 5000
      hashtag_count_min: 3
      hashtag_count_max: 5
      include_shorts_tag: true
      seo_keywords: true
    tiktok:
      enabled: true
      caption_length_optimal: 150
      caption_length_max: 2200
      hashtag_count_min: 3
      hashtag_count_max: 5
      avoid_generic_viral_tags: true
      prioritize_search_keywords: true
    instagram:
      enabled: true
      caption_style: "seo"
      caption_length_short_max: 30
      caption_length_seo_max: 240
      hashtag_count_min: 15
      hashtag_count_max: 30
      hashtags_in_caption: true
      emoji_enabled: true

# ============================================================================
# PLATFORM METADATA SETTINGS (Reference Documentation)
# ============================================================================
# IMPORTANT: This section provides DETAILED DOCUMENTATION and default values.
# The ACTIVE configuration is in description_settings.platform_metadata above.
# These two sections should be kept in sync when modifying platform settings.
#
# Platform-specific metadata optimization for YouTube, TikTok, and Instagram
# Based on 2025 algorithm best practices and SEO research
#
# Pipeline Impact:
# - Enables platform-specific title/description/hashtag generation
# - Overrides unified description mode when enabled
# - Generates separate metadata files per platform (metadata_youtube.json, etc.)
# - Maintains backward compatibility when disabled (platform_metadata: null)
#
# Usage:
# - Set description_settings.platform_metadata.enabled to true to enable
# - Configure target_platform to control which platforms to generate for
# - Adjust per-platform settings to match your content strategy
platform_metadata_config:
  # Global enable/disable for platform-specific metadata generation
  # When false, falls back to legacy unified description mode
  enabled: true

  # Target platform(s) for metadata generation
  # Options: "youtube", "tiktok", "instagram", "multi"
  # This can be overridden per video profile or via CLI arguments
  target_platform: "multi"

  # ---- Caching Settings ----
  # File-based cache for generated platform metadata
  # Avoids regenerating metadata for unchanged products
  # Cache is keyed by (product_id, platform) with TTL expiration
  cache:
    # Enable/disable metadata caching globally
    # When enabled, repeated requests for same product use cached metadata
    # Recommended: true for batch processing, false for debugging
    enabled: true

    # Time-to-live for cache entries in hours (1-720)
    # After TTL expires, metadata will be regenerated on next request
    # 24h is good for active development, 168h (7 days) for production
    ttl_hours: 24

    # Cache storage directory (relative to project root)
    # JSON files stored as {product_id}_{platform}.json
    # Directory is auto-created if it doesn't exist
    cache_dir: ".cache/platform_metadata"

    # Maximum number of cache entries (0 = unlimited)
    # When exceeded, oldest entries are removed (LRU eviction)
    # 1000 entries ≈ 3000 cached metadata files (3 platforms per product)
    max_entries: 1000

  # ---- A/B Testing Settings ----
  # Enable A/B testing of prompt templates for metadata quality comparison
  # Selection is deterministic based on product_id hash for reproducibility
  # Track variants in metadata.prompt_variant field for analysis
  ab_testing:
    # Global enable/disable for A/B testing
    # When disabled, uses default control templates
    enabled: false

    # YouTube prompt variants
    youtube:
      enabled: true
      variants:
        - name: "control"
          template_path: "src/ai/prompts/youtube_metadata.md"
          weight: 50
          description: "Original YouTube metadata prompt"
        # Add more variants for testing:
        # - name: "variant_a"
        #   template_path: "src/ai/prompts/youtube_metadata_v2.md"
        #   weight: 50
        #   description: "New YouTube prompt with shorter titles"

    # TikTok prompt variants
    tiktok:
      enabled: true
      variants:
        - name: "control"
          template_path: "src/ai/prompts/tiktok_caption.md"
          weight: 50
          description: "Original TikTok caption prompt"

    # Instagram prompt variants
    instagram:
      enabled: true
      variants:
        - name: "control"
          template_path: "src/ai/prompts/instagram_caption.md"
          weight: 50
          description: "Original Instagram caption prompt"

  # ---- Batch Generation Settings ----
  # Concurrent processing of multiple products for efficient batch workflows
  # Respects rate limits via semaphore-based concurrency control
  # Progress tracked with [N/total] format for monitoring
  batch:
    # Enable/disable batch metadata generation
    # When enabled, allows processing multiple products concurrently
    enabled: true

    # Maximum concurrent product generations (1-20)
    # Higher values = faster batch completion but more API load
    # 3 is conservative for rate-limited APIs, 10 for high-throughput
    # Recommendation: Start with 3, increase if no rate limit errors
    max_concurrent: 3

    # Enable progress logging with [N/total] format
    # Logs: "[1/10] B0TESTASIN: starting" -> "[1/10] B0TESTASIN: success"
    # Useful for monitoring batch progress in production
    log_progress: true

  # ---- Export Settings ----
  # Control metadata export formats, encoding, and platform-specific options
  # Supports JSON, CSV, YouTube CSV, TikTok, and Instagram formats
  export:
    # Enable/disable metadata export functionality
    enabled: true

    # Default export format when not specified
    # Options: json, csv, youtube_csv, tiktok, instagram
    default_format: "json"

    # Default YouTube category ID for YouTube CSV exports
    # Common IDs: 22=People & Blogs, 28=Science & Tech, 10=Music
    # Full list: https://developers.google.com/youtube/v3/docs/videoCategories
    youtube_category: "22"

    # Default privacy setting for YouTube exports
    # Options: private, public, unlisted
    # Recommendation: "private" for review before publishing
    youtube_privacy: "private"

    # CSV file encoding for spreadsheet compatibility
    # utf-8-sig = UTF-8 with BOM (recommended for Excel)
    # utf-8 = standard UTF-8 (for other tools)
    csv_encoding: "utf-8-sig"

    # JSON indentation for pretty-printing (0-8 spaces)
    # 2 = readable, 0 = compact (smaller file size)
    json_indent: 2

    # Max title length when using description as title fallback
    # Used in YouTube CSV when title field is empty
    youtube_title_fallback_length: 60

  # ---- Trend Settings ----
  # Integrate with trend providers to suggest current hashtags
  # Improving discoverability with platform-specific trending tags
  trends:
    # Enable/disable trend-aware hashtags globally
    # When enabled, merges trending tags with generated hashtags
    enabled: false

    # Trend provider to use
    # Options: static (high-perf fallback), mock (testing)
    # Future: tiktok_api, google_trends
    provider: "static"

    # Time-to-live for cached trends in hours (1-24)
    # Trending tags don't change every minute, 4-12h is recommended
    cache_ttl_hours: 4

    # Maximum number of trending tags to add per platform (1-5)
    # Respects platform hashtag limits during merging
    max_trending_tags: 2

    # Fallback trending tags per platform when external APIs unavailable
    # Used by static provider or as baseline when API calls fail
    # Customize per niche: tech, beauty, fitness, etc.
    fallback_tags:
      youtube:
        - "#Shorts"
        - "#Trending"
        - "#Tech"
        - "#Gadgets"
        - "#Review"
      tiktok:
        - "#ForYou"
        - "#Viral"
        - "#LifeHack"
        - "#Shopping"
        - "#TechTok"
      instagram:
        - "#Reels"
        - "#InstaGood"
        - "#Innovation"
        - "#Gadget"
        - "#TechLife"

  # ---- YouTube Settings ----
  # Optimized for YouTube Shorts discovery and search ranking
  # Key factors: Front-loaded keywords, #Shorts tag, 3-5 targeted hashtags
  youtube:
    enabled: true

    # Maximum title length (characters)
    # YouTube allows 100 chars, but 50-60 is optimal for mobile display
    # SEO best practice: Place primary keywords in first 50 characters
    # Recommendation: Keep titles punchy and keyword-rich for Shorts
    title_length_max: 60

    # Maximum description length (characters)
    # YouTube allows 5000 chars, but first 150 are shown without "Show more"
    # SEO best practice: Front-load important info and keywords in first 150 chars
    # Include call-to-action, product links, and detailed info after
    description_length_max: 5000

    # Hashtag count range (min-max)
    # YouTube recommends 3-5 hashtags maximum for best performance
    # Too many hashtags (>15) can result in all hashtags being ignored
    # Focus on niche-specific tags rather than generic viral tags
    hashtag_count_min: 3
    hashtag_count_max: 5

    # Automatically include #Shorts hashtag for vertical videos <60 seconds
    # Critical for YouTube Shorts discovery and recommendation algorithm
    # Set to false if manually managing hashtags or creating long-form content
    include_shorts_tag: true

    # Enable SEO keyword optimization in title and description
    # Places high-value search terms at beginning of title
    # Incorporates exact search phrases in first 150 chars of description
    # Recommended: true for maximum discoverability
    seo_keywords: true

  # ---- TikTok Settings ----
  # Optimized for TikTok's search-engine model (2024+ algorithm shift)
  # Key factors: Exact search phrases, niche hashtags, avoid generic viral tags
  tiktok:
    enabled: true

    # Optimal caption length for engagement (characters)
    # TikTok allows 2200 chars, but 100-300 is optimal for readability
    # Algorithm favors concise, searchable captions over creative hooks
    # Use exact search phrases (e.g., "morning skincare routine") vs creative text
    caption_length_optimal: 150

    # Maximum caption length (characters)
    # Hard limit imposed by TikTok platform
    # Exceeding this will cause caption truncation
    caption_length_max: 2200

    # Hashtag count range (min-max)
    # TikTok performs best with 3-5 targeted, niche-specific hashtags
    # Avoid overusing hashtags - quality over quantity
    # Mix of trending niche tags + evergreen category tags works best
    hashtag_count_min: 3
    hashtag_count_max: 5

    # Enable SEO-focused caption style
    # true = Use exact search phrases and keywords
    # false = Allow more creative, hook-based captions
    # 2025 best practice: true (TikTok is now a search engine)
    seo_focused: true

    # Generic hashtags to avoid
    # These tags are overused and provide no discovery value
    # Algorithm may even penalize content using only generic viral tags
    # Focus on niche community hashtags instead (e.g., #TechReview vs #FYP)
    avoid_generic_tags:
      - "foryoupage"
      - "fyp"
      - "viral"
      - "foryou"

  # ---- Instagram Settings ----
  # Optimized for Instagram Reels discovery and engagement
  # Key factors: 15-30 hashtags in caption (not comments), dual caption styles
  instagram:
    enabled: true

    # Caption style for Instagram Reels
    # Options: "short" (3-5 words, ultra-concise) or "seo" (100-200 chars, keyword-rich)
    # "short" = Trend-following, minimal text (e.g., "This changed everything ✨")
    # "seo" = Search-optimized, descriptive (e.g., "Best wireless earbuds under $50 for workouts")
    # Recommendation: "seo" for product content, "short" for viral trends
    caption_style: "seo"

    # Caption length for "short" style (characters)
    # Ultra-brief captions that hook viewers immediately
    # Typically 3-5 words or 10-15 characters
    # Works well with emoji and strong visual content
    caption_length_short: 15

    # Caption length for "seo" style (characters)
    # Descriptive captions with keywords for search discovery + closing-line mirror
    # 100-240 characters provides context plus the engagement-bait line from the script
    # while staying well under Instagram's 2200-char hard cap
    caption_length_seo: 240

    # Hashtag count range (min-max)
    # Instagram allows 30 hashtags and actively encourages using 15-30
    # CRITICAL: Place hashtags IN CAPTION, not in comments (algorithm change)
    # Mix trending, niche, and evergreen hashtags for maximum reach
    # Formula: 5-10 high-volume + 10-15 niche + 5-10 branded/specific
    hashtag_count_min: 15
    hashtag_count_max: 30

    # Enable emoji usage in captions and hashtags
    # Emojis increase engagement and visual appeal on Instagram
    # Use strategically to break up text and add personality
    # Recommended: true for lifestyle/consumer products
    emoji_enabled: true

# ============================================================================
# WHISPER SETTINGS (Speech-to-Text)
# ============================================================================
whisper_settings:
  # Whether Whisper is available for subtitle generation
  enabled: true

  # Whisper model size balancing accuracy vs speed/memory
  # "tiny" = fastest, least accurate, "small" = balanced
  # "medium" = better accuracy, "large" = best accuracy, slowest
  model_size: "small"

  # Device for Whisper processing
  # "cpu" = use CPU (compatible), "cuda" = use GPU (faster if available)
  model_device: "cpu"

  # Whether to keep model in memory between uses
  model_in_memory: false

  # Directory for downloading Whisper models
  # Empty = use default cache directory (~/.cache/whisper)
  model_download_root: ""

  # Temperature for Whisper transcription (0.0 to 1.0)
  temperature: 0.0

  # Language code for transcription
  language: "en"

  # Beam size for Whisper search algorithm
  # Higher = better accuracy but slower processing
  # Range: 1 (fastest, greedy) to 10 (most accurate), default 5
  # Use 1-3 for fast drafts, 5 for balanced, 7-10 for final quality
  beam_size: 5

  # Whether to use 16-bit floating point precision
  fp16: false

  # Threshold for compression ratio to detect repetitive text
  # Lower values = more aggressive filtering of repeated phrases
  # Range: 1.5 (strict) to 3.5 (permissive), default 2.4
  # Increase if valid repetitive content is being filtered out
  compression_ratio_threshold: 2.4

  # Threshold for log probability to filter low-confidence words
  # More negative = more permissive (keeps lower confidence words)
  # Range: -2.0 (very permissive) to 0.0 (strict), default -1.0
  # Decrease if words are being dropped; increase if garbage text appears
  logprob_threshold: -1.0

  # Threshold for detecting silence vs speech
  # Lowered from 0.5 to 0.2 to capture speech with background noise
  no_speech_threshold: 0.2

  # Whether to use previous text context for better accuracy
  condition_on_previous_text: true

  # Whisper task type: "transcribe" or "translate"
  task: "transcribe"

  # Patience parameter for beam search
  # null = automatic (recommended), or 0.0-2.0 for manual control
  # Higher values explore more hypotheses before settling on answer
  # Only set if you understand beam search; null works well for most cases
  patience: null

  # Timeout settings for Whisper processing
  base_timeout_sec: 120
  duration_multiplier: 6.0  # Increased from 3.0 for reliable transcription
  max_timeout_sec: 900  # Increased from 600 for longer audio

  # Progress monitoring interval in seconds
  progress_monitor_interval_sec: 30

  # Enable detailed resource monitoring during transcription
  enable_resource_monitoring: true

  # Enable automatic resource cleanup after processing
  enable_resource_cleanup: true

# ============================================================================
# AUDIO PROCESSING SETTINGS
# ============================================================================
audio_processing:
  # Enable/disable Coqui TTS GPU acceleration
  coqui_gpu_enabled: false

  # Audio encoding for Google TTS output
  google_tts_audio_encoding: "LINEAR16"

  # Minimum valid audio file size in bytes
  min_audio_file_size_bytes: 100

  # Timeout for audio validation operations
  audio_validation_timeout_sec: 30

  # ---- Silence Removal Settings ----
  # These settings control automatic silence trimming from TTS-generated voiceovers
  # CRITICAL: Ensures Whisper STT timestamps align with actual audio
  # Whisper normalizes timestamps to start at 0 (first detected speech)
  # Without trimming, subtitles will appear before actual speech starts

  # Enable/disable silence trimming (RECOMMENDED: true)
  silence_removal_enabled: true

  # Silence detection threshold in decibels
  # Lower values = more sensitive (detects quieter silence)
  # -50dB preserves quiet speech endings and trailing consonants
  # Range: -60 (very sensitive) to -20 (only very quiet silence)
  silence_threshold_db: -50

  # ffmpeg silenceremove start_duration: the confirmation window of
  # continuous non-silence the filter must see before it stops trimming.
  # Audio during this window is DISCARDED, not kept — so larger values
  # trim MORE aggressively, not less. If this is longer than a short
  # trailing word (e.g. "tips" at ~0.4s), that word is eaten by the
  # confirmation window. Keep at 0.1s or below.
  silence_min_duration_sec: 0.1

