# ContentEngineAI Global Pipeline Configuration
# End-to-end configuration for scraping and video production

# ============================================================================
# GLOBAL BATCH PIPELINE
# ============================================================================
# Unified configuration for scraping products and producing videos in one command
# Combines scraper and video producer settings with shared common options

global_batch:
  # ---- Input Configuration ----
  # Where a run's inputs come from. None of these keys is required: with all
  # of them empty a run still draws keywords from the scraper's pool (see
  # `keywords` below) and topics from `topics`. Adding a keyword here does
  # not extend that pool, it replaces it.

  # Product IDs (ASINs) to scrape and produce videos for
  # Example: ["B0ABC123", "B0DEF456", "B0GHI789"]
  product_ids: []

  # Keywords to search for products, grouped by content pillar.
  # Dict shape attaches the pillar to each scraped product automatically.
  # A flat list is also accepted (no pillar attached).
  #
  # Left empty on purpose: the batch then draws the scraper's pool from
  # `config/scraper.yaml::batch.keywords`, so there is one list to maintain.
  # This key used to carry six keywords, every one of them also in that file,
  # which meant the batch searched six of the fifty-four configured next door
  # -- and at `products_per_keyword: 1` a six-product run exhausted the pool
  # exactly and returned the same products every time. Setting this replaces
  # the scraper's pool for batch runs -- it does not add to it or re-pillar
  # one keyword of it, so a single entry here narrows every batch run to that
  # one keyword.
  keywords: {}

  # How many keywords one run searches, taken in rotation from the pool by
  # date. Consecutive days are disjoint while this is at most half the pool;
  # past that they must overlap, and measurably do (30 of 54 shares six with
  # the next day, 40 shares twenty-six). Defaults to what the run will
  # actually consume (`max_products` / `products_per_keyword`), which is the
  # width that makes the rotation land on fresh keywords rather than
  # re-serving the head of the list.
  # keywords_per_run: 10

  # Topics to render without scraping. A topic has no listing, so it produces
  # a video from a title and a description instead of from product data.
  #
  # This is what puts the tutorial arm into the daily cadence: without it a
  # topic could only enter a run by being typed on that day's command line, so
  # a run with no input flags -- the repeatable path, and the one a scheduled
  # run uses -- produced product renders and nothing else.
  #
  # Same shape as a `--topics-file`.
  topics:
    - title: "Why your wifi keeps dropping"
      description: "Router placement, channel congestion, 2.4 vs 5GHz bands."
      keywords: ["wifi router", "home network"]
    - title: "Your phone battery is not dying as fast as you think"
      description: "Background refresh, screen brightness, battery health."
      keywords: ["phone charging", "smartphone battery"]

  # How many of the topics above a run with no input flags includes, alongside
  # the configured keywords. Topics named on the command line are taken in
  # full and ignore this.
  #
  # Taken in rotation from the date rather than from the top of the list, so a
  # daily run works through the list instead of re-rendering the first entry
  # every morning. Interleaving matters beyond variety: comparing the two
  # content formats fairly needs them mixed through the week rather than run in
  # blocks, since a block comparison cannot separate the format from whatever
  # else changed that week.
  #
  # 0 = products only.
  topics_per_run: 1

  # Maximum total products to collect across all keywords (global cap)
  # Processing stops when this limit is reached, even if keywords remain
  # Default: 10
  max_products: 10

  # Maximum products to scrape per individual keyword
  # Default: 1
  products_per_keyword: 1

  # ---- Scraper Filter Configuration ----
  # Optional filters to apply when searching for products
  scraper_filters:
    # Minimum price filter (e.g., 10.99)
    # Default: null (no minimum)
    min_price: null

    # Maximum price filter (e.g., 99.99)
    # Default: null (no maximum)
    max_price: null

    # Minimum rating filter (1-5 stars, e.g., 4.0)
    # Default: null (no minimum)
    min_rating: null

    # Filter for Prime eligible items only
    # Default: false
    prime_only: false

  # ---- Video Production Configuration ----
  # Profile selection mode - choose ONE of the following:

  # Fixed profile: Use the same profile for all products
  # Example: "slideshow_images1"
  # Mutually exclusive with random_profile
  profile: null

  # Random profile: Enable random profile selection per product
  # Each product gets a randomly selected profile (deterministic by product ID)
  # Mutually exclusive with profile
  # Default: false
  random_profile: false

  # Profile pool: List of profiles for random selection
  # Used when random_profile is true
  # If empty, all available profiles will be used
  # Example: ["slideshow_images1", "video_sequential", "product_video_hybrid"]
  profile_pool: []

  # ---- Common Options ----
  # Settings that apply to both scraping and video production

  # Stop pipeline on first failure
  # If true: Pipeline stops immediately when any product fails
  # If false: Pipeline continues processing remaining products
  # Default: false
  fail_fast: false

  # Directory for scraper output and producer input
  # Default: "outputs"
  outputs_dir: "outputs"

  # Enable debug mode with detailed logging
  # Default: false
  debug: false

  # ---- State Persistence (Resume Capability) ----
  # Pipeline state is automatically saved to outputs/.pipeline_state.json
  # after each phase completes. This enables resuming interrupted pipelines.
  #
  # To resume an interrupted pipeline, run with --resume flag:
  #   python -m src.pipeline.global_batch --resume
  #
  # On successful completion, the state file is automatically cleared.
  # Corrupted state files are handled gracefully (pipeline starts fresh).

  # ---- Dry-Run Mode ----
  # Preview pipeline plan without executing any phases.
  # Validates configuration and shows planned actions.
  #
  # To preview execution plan:
  #   python -m src.pipeline.global_batch --dry-run [other options]
  #
  # Shows: products to scrape, profiles to use, platforms to publish,
  # API key status, and scheduling mode.

  # ---- Webhook Notifications ----
  # Send HTTP POST notifications on pipeline events for external monitoring.
  # Webhooks are non-blocking: failures never stop the pipeline.
  webhook:
    # Webhook endpoint URL (must be http:// or https://)
    # Set to null to disable webhooks
    # Example: "https://example.com/pipeline-events"
    url: null

    # Enable/disable webhook notifications
    # Default: true (sends notifications if URL is configured)
    enabled: true

    # Request timeout in seconds
    # Webhook calls that exceed this timeout are considered failed
    # Default: 5.0
    timeout_sec: 5.0

    # Maximum retry attempts for failed webhook calls
    # Uses exponential backoff: 1s, 2s, 4s between retries
    # Default: 3
    max_retries: 3

    # Initial delay between retries in seconds (doubles each attempt)
    # Default: 1.0
    retry_delay_sec: 1.0

    # Event types to send notifications for
    # Options: phase.complete, phase.failed, pipeline.complete, pipeline.failed
    # Default: all events
    events:
      - phase.complete
      - phase.failed
      - pipeline.complete
      - pipeline.failed

# ============================================================================
# EXAMPLE CONFIGURATIONS
# ============================================================================
# Uncomment and modify one of these examples to get started:

# Example 1: Scrape specific product and create video with fixed profile
# global_batch:
#   product_ids: ["B0ABC123"]
#   profile: "slideshow_images1"
#   debug: true

# Example 2: Search keywords and create videos with random profile selection
# global_batch:
#   keywords: ["wireless earbuds", "bluetooth speaker"]
#   random_profile: true
#   profile_pool: ["slideshow_images1", "video_sequential"]
#   max_products: 5

# Example 3: Batch processing with filters and fail-fast
# global_batch:
#   product_ids: ["B0ABC123", "B0DEF456", "B0GHI789"]
#   profile: "product_video_hybrid"
#   scraper_filters:
#     min_price: 15.00
#     max_price: 100.00
#     min_rating: 4.0
#     prime_only: true
#   fail_fast: true
