# ContentEngineAI Performance & API Configuration
# Performance tuning, API timeouts, and network optimization for both systems

# ============================================================================
# FFMPEG SETTINGS
# ============================================================================
ffmpeg_settings:
  # Path to FFmpeg executable (empty = use system PATH)
  executable_path: ""

  # Temporary directory for FFmpeg intermediate files
  temp_ffmpeg_dir: "ffmpeg_work"

  # FFmpeg preset for intermediate processing
  intermediate_segment_preset: "ultrafast"

  # Maximum time to wait for final video assembly in seconds
  final_assembly_timeout_sec: 600

  # FFmpeg I/O timeout in microseconds
  # 30,000,000 microseconds = 30 seconds
  # Used for: Network streams, slow storage, large files
  # Increase if seeing "Connection timed out" errors during video processing
  rw_timeout_microseconds: 30000000

  # FFmpeg validation timeout (seconds)
  # Maximum time to wait for FFmpeg -version check during startup validation
  # Used in config_validator.py to verify FFmpeg is available and working
  # Affects: Application startup validation speed
  validation_timeout_sec: 10
  
# ============================================================================
# OPTIMIZATION SETTINGS
# ============================================================================
optimization_settings:
  # Background processing settings
  background_processing:
    enabled: true
    max_workers: 4
    queue_size: 100
    
  # Connection pooling
  connection_pooling:
    enabled: true
    max_connections: 20
    connection_timeout: 30
    
  # Async I/O settings
  async_io:
    enabled: true
    chunk_size: 8192
    max_concurrent: 10
    
  # Caching configuration
  caching:
    enabled: true
    ttl_seconds: 3600  # 1 hour
    max_size_mb: 100
    
  # Memory optimization
  memory:
    # Garbage collection settings
    gc_threshold: 0.8
    max_memory_mb: 2048

    # Image processing memory limits
    max_image_size_mb: 50
    image_processing_workers: 2

    # Memory-mapped I/O threshold (bytes)
    # Files larger than this use memory-mapped I/O for ~2-3x faster copying
    # Files smaller use standard copy methods (lower overhead)
    # 1,048,576 bytes = 1 MB (1024 * 1024)
    # Typical values: 1MB (default), 512KB for SSDs, 4MB for HDDs
    mmap_threshold_bytes: 1048576

# ============================================================================
# API SETTINGS
# ============================================================================
api_settings:
  # ---- LLM API specific settings ----
  llm:
    model_fetch_timeout_sec: 15
    retry_attempts: 3
    retry_min_wait_sec: 2
    retry_max_wait_sec: 30
    retry_multiplier: 1.5
    
  # ---- TTS API settings ----
  tts:
    request_timeout_sec: 60
    retry_attempts: 2
    chunk_size_chars: 4000
    
  # ---- Stock media API settings ----
  stock_media:
    concurrent_downloads: 5
    search_multiplier: 2
    max_per_page: 80
    request_timeout_sec: 30
    
  # ---- General API settings ----
  general:
    default_request_timeout_sec: 15
    default_retry_attempts: 3
    default_retry_delay_sec: 5
    
    # Rate limiting
    rate_limit:
      enabled: true
      requests_per_minute: 60
      burst_limit: 10
      
  # ---- Download settings ----
  downloads:
    timeout_sec: 30
    retry_attempts: 3
    retry_min_wait_sec: 2
    retry_max_wait_sec: 10
    
    # Concurrent download limits
    max_concurrent_downloads: 5
    chunk_size_bytes: 1048576  # 1MB
    
    # File size limits
    max_file_size_mb: 50

# ============================================================================
# CIRCUIT BREAKER SETTINGS
# ============================================================================
# Circuit breakers prevent cascading failures when external services are down
# After `failure_threshold` consecutive failures, the circuit "opens" and
# fast-fails for `timeout_sec` seconds before attempting recovery
#
# Used by: src/utils/circuit_breaker.py
# Impact: Controls fallback behavior for Freesound, Pexels, OpenRouter, etc.
circuit_breaker:
  # Google Speech-to-Text service
  google_stt:
    failure_threshold: 3
    timeout_sec: 120  # 2 minutes recovery time

  # Freesound audio API
  freesound:
    failure_threshold: 3
    timeout_sec: 60  # 1 minute recovery time

  # Pexels stock media API
  pexels:
    failure_threshold: 3
    timeout_sec: 90  # 1.5 minutes recovery time

  # LLM API (OpenRouter, Gemini, etc.)
  llm:
    failure_threshold: 2
    timeout_sec: 30  # 30 seconds recovery time

  # Web scraper circuit breaker
  scraper:
    failure_threshold: 5
    timeout_sec: 60  # 1 minute recovery time

# ============================================================================
# DEBUG SETTINGS
# ============================================================================
debug_settings:
  # Logging configuration
  max_log_line_length: 200
  debug_file_retention_days: 7

  # File cleanup behavior
  # Cleanup policy: Controls when temporary/intermediate files are removed
  # - intermediate_file_cleanup: Master switch for cleanup (true = enable cleanup)
  # - cleanup_on_success: Remove temp files after successful pipeline execution
  # - cleanup_on_failure: Remove temp files after failed pipeline execution (debugging aid when false)
  # - cleanup_whisper_files: Remove Whisper STT temporary files
  # Note: CLI --debug flag overrides these settings and retains all files for debugging
  intermediate_file_cleanup: true
  cleanup_on_success: false
  cleanup_on_failure: false  # Keep files on failure for debugging
  cleanup_whisper_files: false

  # Debug file generation controls
  create_media_validation_reports: true
  create_ffmpeg_command_logs: true
  create_pipeline_metadata: true
  create_performance_metrics: true
  create_whisper_debug_files: true
  create_temp_files: true

  # Performance thresholds
  operation_timing_threshold_sec: 5.0
  memory_usage_warning_mb: 1000