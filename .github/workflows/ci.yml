name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Every PR is a release (docs/versioning.md): the version is bumped and the
  # CHANGELOG heading dated in the PR itself. A required check, so it must
  # never be skipped by a path filter: a skipped required check stays pending.
  version-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Check the release
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          python -m tools.release_check --base "origin/$BASE_REF"
        else
          python -m tools.release_check
        fi

    - name: Report requirements no test cites
      run: python -m tools.requirements_coverage

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}-pycaps

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: |
        poetry run pip install "setuptools<81" wheel
        poetry run pip install --no-build-isolation openai-whisper==20240930
        poetry install --no-interaction --with pycaps

    - name: Install project
      if: steps.cached-poetry-dependencies.outputs.cache-hit == 'true'
      run: |
        poetry run pip install "setuptools<81" wheel
        poetry run pip install --no-build-isolation openai-whisper==20240930
        poetry install --no-interaction --with pycaps

    - name: Run linting
      run: |
        poetry run ruff check .
        poetry run ruff format --check .

    - name: Run type checking
      run: poetry run mypy .

  # A required check, so it always runs and reports. For a change that touches
  # only documentation (tools/check_docs.py decides) it runs just the tests
  # that read the docs, `make test-docs`, and skips the full suite. On a push
  # to main it runs nothing when the merged tree is the one its pull request's
  # test job already passed (tools/merge_was_tested.py decides).
  test:
    runs-on: ubuntu-latest
    # Reading the merged pull request and its check runs.
    permissions:
      contents: read
      pull-requests: read
      checks: read
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    # full: the suite; docs: only the tests that read the docs; skip: a
    # merge to main whose exact tree already passed on its pull request.
    - name: Decide what to test
      id: scope
      env:
        BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
        GH_TOKEN: ${{ github.token }}
      run: |
        tested=false
        if [ "${{ github.event_name }}" = "push" ]; then
          tested=$(python -m tools.merge_was_tested --repo "${{ github.repository }}" --sha "${{ github.sha }}") || tested=false
        fi
        docs_only=$(python -m tools.check_docs --base "$BASE" --docs-only) || docs_only=false
        if [ "$tested" = "true" ]; then mode=skip
        elif [ "$docs_only" = "true" ]; then mode=docs
        else mode=full; fi
        echo "mode=$mode"
        echo "mode=$mode" >> "$GITHUB_OUTPUT"

    - name: Install system dependencies
      if: steps.scope.outputs.mode == 'full'
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Poetry
      if: steps.scope.outputs.mode != 'skip'
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Load cached venv
      if: steps.scope.outputs.mode != 'skip'
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}-pycaps

    - name: Install dependencies
      if: steps.scope.outputs.mode != 'skip' && steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: |
        poetry run pip install "setuptools<81" wheel
        poetry run pip install --no-build-isolation openai-whisper==20240930
        poetry install --no-interaction --with pycaps

    - name: Install project
      if: steps.scope.outputs.mode != 'skip' && steps.cached-poetry-dependencies.outputs.cache-hit == 'true'
      run: |
        poetry run pip install "setuptools<81" wheel
        poetry run pip install --no-build-isolation openai-whisper==20240930
        poetry install --no-interaction --with pycaps

    - name: Install pictex system libraries
      if: steps.scope.outputs.mode == 'full'
      # skia-python (pycaps' pictex renderer) links libEGL and libGL, which
      # ubuntu-latest does not ship; without them the two pictex render
      # tests fail on import.
      run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1

    - name: Install Playwright browsers
      if: steps.scope.outputs.mode == 'full'
      run: poetry run playwright install

    - name: Run tests
      if: steps.scope.outputs.mode == 'full'
      # -n auto: the suite ran on one core while the runner has four.
      run: poetry run pytest -n auto --cov=src --cov-report=xml --cov-report=term-missing

    - name: Run the tests that read the docs
      if: steps.scope.outputs.mode == 'docs'
      run: make test-docs

    - name: Upload coverage to Codecov
      if: steps.scope.outputs.mode == 'full'
      # Coverage is a report, not a gate: when the service is unreachable the
      # action fails before `fail_ci_if_error` applies, and the required test
      # check would block every merge.
      continue-on-error: true
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  # Tag and publish the release once main is green. A tag pushed with
  # GITHUB_TOKEN starts no other workflow, so this job creates the GitHub
  # release itself rather than relying on release.yml, which stays for tags
  # pushed by hand.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version-check, lint, test]
    runs-on: ubuntu-latest
    # No concurrency group: a pending run in a group is replaced by the next
    # one, which would leave that version untagged. Each run tags only its own
    # version, so overlapping runs don't collide.
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    # Decided by the release, not the tag: if the tag went up and the release
    # step then failed, a re-run reuses the tag and creates the release.
    - name: Decide whether this commit is a new release
      id: version
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        VERSION=$(python -m tools.release_check --version)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        if gh release view "v$VERSION" >/dev/null 2>&1; then
          echo "v$VERSION already released; nothing to do"
          echo "new=false" >> "$GITHUB_OUTPUT"
        else
          echo "new=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Tag
      if: steps.version.outputs.new == 'true'
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
          echo "v$VERSION is already tagged; reusing it"
          exit 0
        fi
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -a "v$VERSION" -m "Release v$VERSION"
        git push origin "v$VERSION"

    - name: Extract release notes
      if: steps.version.outputs.new == 'true'
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release-notes.md
        if [ ! -s release-notes.md ]; then
          printf 'Release %s\n\nSee CHANGELOG.md for details.\n' "$VERSION" > release-notes.md
        fi

    - name: Create GitHub Release
      if: steps.version.outputs.new == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.version }}
        body_path: release-notes.md
