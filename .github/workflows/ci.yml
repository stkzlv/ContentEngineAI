name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # Every PR is a release (docs/versioning.md): the version is bumped and the
  # CHANGELOG heading dated in the PR itself. A required check, so it must
  # never be skipped by a path filter: a skipped required check stays pending.
  version-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Check the release
      env:
        BASE_REF: ${{ github.base_ref }}
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          python -m tools.release_check --base "origin/$BASE_REF"
        else
          python -m tools.release_check
        fi

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}-pycaps

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: |
        poetry run pip install "setuptools<81" wheel
        poetry run pip install --no-build-isolation openai-whisper==20240930
        poetry install --no-interaction --with pycaps

    - name: Install project
      if: steps.cached-poetry-dependencies.outputs.cache-hit == 'true'
      run: |
        poetry run pip install "setuptools<81" wheel
        poetry run pip install --no-build-isolation openai-whisper==20240930
        poetry install --no-interaction --with pycaps

    - name: Run linting
      run: |
        poetry run ruff check .
        poetry run ruff format --check .

    - name: Run type checking
      run: poetry run mypy .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
    - uses: actions/checkout@v5

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true

    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ matrix.python-version }}-${{ hashFiles('**/poetry.lock') }}-pycaps

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      run: |
        poetry run pip install "setuptools<81" wheel
        poetry run pip install --no-build-isolation openai-whisper==20240930
        poetry install --no-interaction --with pycaps

    - name: Install project
      if: steps.cached-poetry-dependencies.outputs.cache-hit == 'true'
      run: |
        poetry run pip install "setuptools<81" wheel
        poetry run pip install --no-build-isolation openai-whisper==20240930
        poetry install --no-interaction --with pycaps

    - name: Install pictex system libraries
      # skia-python (pycaps' pictex renderer) links libEGL and libGL, which
      # ubuntu-latest does not ship; without them the two pictex render
      # tests fail on import.
      run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1

    - name: Install Playwright browsers
      run: poetry run playwright install

    - name: Run tests
      run: poetry run pytest --cov=src --cov-report=xml --cov-report=term-missing

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  # Tag and publish the release once main is green. A tag pushed with
  # GITHUB_TOKEN starts no other workflow, so this job creates the GitHub
  # release itself rather than relying on release.yml, which stays for tags
  # pushed by hand.
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version-check, lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0

    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"

    - name: Decide whether this commit is a new release
      id: version
      run: |
        VERSION=$(python -m tools.release_check --version)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
          echo "v$VERSION already tagged; nothing to release"
          echo "new=false" >> "$GITHUB_OUTPUT"
        else
          echo "new=true" >> "$GITHUB_OUTPUT"
        fi

    - name: Tag
      if: steps.version.outputs.new == 'true'
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git tag -a "v$VERSION" -m "Release v$VERSION"
        git push origin "v$VERSION"

    - name: Extract release notes
      if: steps.version.outputs.new == 'true'
      env:
        VERSION: ${{ steps.version.outputs.version }}
      run: |
        awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md > release-notes.md
        if [ ! -s release-notes.md ]; then
          printf 'Release %s\n\nSee CHANGELOG.md for details.\n' "$VERSION" > release-notes.md
        fi

    - name: Create GitHub Release
      if: steps.version.outputs.new == 'true'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v${{ steps.version.outputs.version }}
        name: Release ${{ steps.version.outputs.version }}
        body_path: release-notes.md
